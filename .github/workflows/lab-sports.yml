name: Sports lab

# Collects richer per-game data (closing lines, who played) for every league on GitHub's runners and commits it under
# data/sports/lab (pipeline/sports/lab.py). Started by hand, or by a push that changes the marker file.
on:
  push:
    branches: [main]
    paths: [".github/run-lab.txt"]
  workflow_dispatch:
    inputs:
      mode:
        description: "probe | probe2 | collect | cfbd | bdb | kalshi | oddscore | oddsfill | sgo | sgofill | cfbdlines | bdb27 | bdb27test | retune | cfbdtalent"
        default: "probe"
      leagues:
        description: "Leagues (comma separated)"
        default: "nfl,ncaaf,nhl,nba,ncaab,ncaah,mlb"

permissions:
  contents: write

concurrency:
  group: sports-lab-${{ github.event.inputs.mode }}-${{ github.event.inputs.leagues }}
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 numpy==2.1.3 kaggle==2.2.5
      - name: Run the lab
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
          KAGGLE_API_KEY: ${{ secrets.KAGGLE_API_KEY }}
          SGO_KEY: ${{ secrets.SGO_KEY }}
        run: |
          git config user.name "sports-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MODE="${{ github.event.inputs.mode || 'probe' }}"
          export LAB_LG="${{ github.event.inputs.leagues || 'nfl,ncaaf,nhl,nba,ncaab,ncaah,mlb' }}"
          save() {
            git add data/sports
            if git diff --cached --quiet; then echo "nothing new for $1"; return; fi
            git commit -q -m "data: $1"
            for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; sleep 5; done
          }
          if [ "$MODE" = "collect" ]; then
            for lg in $(echo "$LAB_LG" | tr ',' ' '); do
              echo "::group::collect $lg"
              LAB_LG=$lg python -m pipeline.sports.run lab-collect || echo "collect $lg exited with an error"
              echo "::endgroup::"
              save "sports lab ($lg)"
              python - "$lg" <<'PY'
          import json, sys
          s = json.load(open("data/sports/status.json")).get("lab-collect", {})
          r = (s.get("sources") or {}).get("collect", {})
          print("::notice title=lab " + sys.argv[1] + "::" + json.dumps(r.get("result") or r.get("error"))[:1500])
          PY
            done
          else
            python -m pipeline.sports.run "lab-$MODE" || echo "lab $MODE exited with an error"
            save "sports lab ($MODE)"
          fi
