name: Sports feed probe (branch only)

on:
  push:
    branches: [sports-live-data]
    paths: ["pipeline/sports/probe.py", ".github/workflows/sports-probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - run: python -m pipeline.sports.probe
      - name: Commit samples to the branch
        run: |
          git config user.name "sports-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sports/_probe
          git commit -q -m "probe: sports feed samples" || exit 0
          git push -q
