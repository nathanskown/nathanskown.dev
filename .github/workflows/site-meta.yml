name: Site meta

# Records when the site last changed (ignoring the bots' data refreshes) in data/site-meta.json,
# which the landing page reads for its "Last updated" line.
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "music/data/daily.json"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: site-meta
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Write and commit
        run: |
          when=$(git log -1 --format=%cI "$GITHUB_SHA")
          printf '{"updated": "%s"}\n' "$when" > data/site-meta.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-meta.json
          git diff --cached --quiet && echo "No change." && exit 0
          git commit -m "data: site meta"
          git pull --rebase origin main
          git push origin HEAD:main
