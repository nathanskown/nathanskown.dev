name: Refresh finance data

on:
  schedule:
    - cron: "7 13-21 * * 1-5"   # market + headlines: hourly through the US trading day (UTC)
    - cron: "7 14,22 * * 0,6"   # headlines on weekends
    - cron: "17 11 * * *"       # daily: quotes, earnings, IPOs, macro (6:17 AM CT in summer)
    - cron: "23 9 3 * *"        # monthly: check for new SEC 13F data sets
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "data/finance/config.json"
      - ".github/workflows/refresh-finance.yml"
  workflow_dispatch:
    inputs:
      run_13f:
        description: "Also rebuild 13F ownership (slow: 20-60 min)"
        type: boolean
        default: false
      jobs:
        description: "Optional: run only these jobs (space separated: market daily screener quarterly)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: finance-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 pandas==2.2.3
      - name: Fetch and commit data, one job at a time
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          OPENFIGI_KEY: ${{ secrets.OPENFIGI_KEY }}
          CRON: ${{ github.event.schedule }}
          RUN_13F: ${{ inputs.run_13f && '1' || '0' }}
          JOBS: ${{ inputs.jobs }}
        run: |
          git config user.name "finance-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit() {
            python tools/site_stats.py || true
            python tools/validate_data.py || true   # holds back any file that fails its checks (keeps the last good version)
            git add data/finance; for f in data/validation.json data/site.json; do [ -f "$f" ] && git add "$f"; done
            if git diff --cached --quiet; then echo "no changes after $1"; return 0; fi
            if python tools/only_timestamps.py; then echo "only timestamps changed after $1: not committing"; git reset -q; git checkout -q -- data/finance; return 0; fi
            git commit -q -m "data: refresh finance data ($1)"
            for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && return 0; sleep 5; done
            return 1
          }
          for job in $(python -m pipeline.run plan); do
            echo "::group::$job"
            python -m pipeline.run "$job" || echo "job $job exited with an error"
            echo "::endgroup::"
            commit "$job"
          done
