name: Probe Fed sources
on:
  push:
    branches: [fed-redline]
    paths: [".github/workflows/probe-fed.yml", "tools/probe_fed.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tools/probe_fed.py 2>&1 | tee /tmp/probe.txt
      - name: Publish results to branch probe-output
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/out; cp /tmp/probe.txt /tmp/out/probe.txt; cp /tmp/fed_*.html /tmp/out/ 2>/dev/null || true
          git checkout --orphan probe-output; git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/out/* .; git add -A; git commit -qm "probe results"; git push -f origin probe-output
