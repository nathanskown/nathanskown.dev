name: Refresh daily challenge schedule

# Picks any missing upcoming days for the music daily challenge and uploads them privately to the site Worker.
# Nothing is committed: the answers must never appear in this public repo.
# Needs the repository secret MUSIC_ADMIN_TOKEN (the same value as the Worker secret of that name).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"   # Mondays

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Pick and upload upcoming days
        env:
          MUSIC_ADMIN_TOKEN: ${{ secrets.MUSIC_ADMIN_TOKEN }}
        run: node tools/build-daily.mjs
