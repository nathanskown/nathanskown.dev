# Rebuilds the Guess the Artist catalog from Last.fm and MusicBrainz.
#
# Runs when you click "Run workflow" (Actions tab), and by itself once whenever the catalog builder or the
# genre mapping (music/assets/variety.js) changes on main. A full rebuild takes 30 to 90 minutes.
# To refresh every Monday, delete the two "#" at the start of the schedule lines below.
#
# Before the first run, add in your GitHub repo (Settings > Secrets and variables > Actions):
#   Secret:    LASTFM_API_KEY   your Last.fm API key
#   Variable:  MB_CONTACT       your email or website (MusicBrainz asks apps to identify themselves)
#   Secret:    MUSIC_ADMIN_TOKEN  same value as the Worker secret (only for the daily top-up after the commit)
name: Refresh artist catalog

on:
  push:
    branches: [main]
    paths: ["tools/build-artist-catalog.mjs", "music/assets/variety.js"]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build into"
        default: "main"
        required: true
  # schedule:
  #   - cron: "17 6 * * 1"

permissions:
  contents: write

concurrency:
  group: refresh-artists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build catalog
        run: node tools/build-artist-catalog.mjs
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          MB_CONTACT: ${{ vars.MB_CONTACT }}
      - name: Commit if anything changed
        run: |
          git config user.name "music-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add music/data tools/.cache
          branch="${{ inputs.branch || github.ref_name }}"
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Refresh artist catalog"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin "$branch" && git push -q origin "HEAD:$branch" && break; sleep 10; done
      # Runs after the commit so a missing or wrong MUSIC_ADMIN_TOKEN can never throw away a finished catalog build.
      - name: Top up the daily schedule on the Worker
        env:
          MUSIC_ADMIN_TOKEN: ${{ secrets.MUSIC_ADMIN_TOKEN }}
        run: node tools/build-daily.mjs
