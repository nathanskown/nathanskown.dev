name: Refresh sports data

on:
  schedule:
    # hourly while games are on: 9 AM to 1 AM Central in summer (8 AM to midnight in winter); times are UTC
    - cron: "17 0-6,14-23 * * *"   # standings, injuries, house model
    - cron: "17 9 * * *"           # one overnight catch-up for late West Coast finals (4 AM Central in summer)
    - cron: "41 10 * * *"   # daily (5:41 AM CT in summer): teams index, stat leaders, then everything hourly
  push:
    branches: [main]
    paths:
      - "pipeline/sports/**"
      - ".github/workflows/refresh-sports.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sports-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 numpy==2.1.3
      - name: Fetch and commit data
        env:
          # Optional. When set, college football results come from CollegeFootballData instead of ESPN.
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
          # Optional. When set, the daily run saves betting-market lines from The Odds API (free plan: 500 credits a month).
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Optional. SportsGameOdds (free Amateur plan): player prop lines for the NFL props tracking.
          SGO_KEY: ${{ secrets.SGO_KEY }}
          CRON: ${{ github.event.schedule }}
        run: |
          git config user.name "sports-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME}"
          for job in $(python -m pipeline.sports.run plan); do
            echo "::group::$job"
            python -m pipeline.sports.run "$job" || echo "job $job exited with an error"
            echo "::endgroup::"
            python tools/site_stats.py || true
            python tools/validate_data.py || true   # holds back any file that fails its checks (keeps the last good version)
            git add data/sports; for f in data/validation.json data/site.json; do [ -f "$f" ] && git add "$f"; done
            if git diff --cached --quiet; then echo "no changes after $job"; continue; fi
            if python tools/only_timestamps.py; then echo "only timestamps changed after $job: not committing"; git reset -q; git checkout -q -- data/sports; continue; fi
            git commit -q -m "data: refresh sports data ($job)"
            for i in 1 2 3; do git pull -q --rebase -X theirs origin "$branch" && git push -q origin "HEAD:$branch" && break; sleep 5; done
          done
