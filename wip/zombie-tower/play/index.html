  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b12">
  <title>Zombie Tower</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0d0b12; overflow: hidden; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #game { width: 100vw; height: 100vh; height: 100dvh; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    [hidden] { display: none !important; }

    /* Phone held upright: the game needs landscape, so cover it with a "turn your phone" screen. */
    #turn { display: none; }
    @media (pointer: coarse) and (orientation: portrait) {
      #turn {
        position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 28px; padding: 24px; box-sizing: border-box; background: #0d0b12;
        color: #e8e2d4; font: 18px/1.7 "Press Start 2P", monospace; text-align: center;
      }
    }
    #turn p { margin: 0; max-width: 20em; }
    #turn svg { width: 96px; height: 96px; }
    #turn a, #turn button {
      display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 18px;
      font: 14px "Press Start 2P", monospace; color: #3dffc5; background: #14111c; border: 2px solid #3dffc5;
      text-decoration: none; text-transform: uppercase;
    }
    #turn a { color: #b9b4c9; border-color: #6b6580; }

    /* Shove / reload / swap in the black bar right of the game, when it is wide enough (Touch.js). */
    #pad {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 10; display: flex; flex-direction: column;
      justify-content: flex-end; gap: 12px; padding: 12px 8px max(16px, env(safe-area-inset-bottom));
      box-sizing: border-box;
    }
    #pad button {
      width: 100%; min-height: 64px; padding: 0; font: 12px "Press Start 2P", monospace; color: #fff;
      background: rgba(20, 17, 28, .85); border: 2px solid rgba(255, 255, 255, .35); touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    #pad button:active { background: rgba(61, 255, 197, .5); }
    #pad button[data-act="melee"] { min-height: 104px; }
  </style>

<body>
  <div id="game"></div>
  <div id="turn" role="dialog" aria-modal="true" aria-labelledby="turnMsg">
    <svg viewBox="0 0 24 24" fill="none" stroke="#3dffc5" stroke-width="1.5" aria-hidden="true">
      <rect x="7" y="2" width="10" height="17" rx="1"/><path d="M11 16.5h2"/>
      <path d="M3 13a9 9 0 0 0 7 8.5"/><path d="M8 19.5l2 2-2 2" transform="translate(0 -2)"/>
    </svg>
    <p id="turnMsg">Turn your phone sideways to play Zombie Tower</p>
    <button type="button" id="fullscreen" hidden>Play full screen</button>
    <a href="/wip/zombie-tower/">Back to Zombie Tower</a>
  </div>
  <div id="pad" hidden>
    <button type="button" data-act="swap">SWAP</button>
    <button type="button" data-act="reload">RELOAD</button>
    <button type="button" data-act="melee">SHOVE</button>
  </div>
