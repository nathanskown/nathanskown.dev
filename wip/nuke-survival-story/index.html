<body>
  <div class="app" id="app">

    <header class="top">
      <a class="brand" href="/">1-NSKN</a>
      <span class="crumb">» <a href="/wip/">WIP</a> » <span id="crumb">PLEASE HOLD</span></span>
      <span class="grow"></span>
      <span class="live" id="live"><i></i><span id="liveText">IDLE</span></span>
      <button type="button" id="flashToggle" class="flash-toggle" aria-pressed="true">FLASH ON</button>
      <span class="clock" id="clock">--:-- --</span>
    </header>

    <nav class="fkeys" id="fkeys" aria-label="Quick commands">
      <button type="button" data-cmd="look"><b>1)</b> LOOK</button>
      <button type="button" data-cmd="inventory"><b>2)</b> INV</button>
      <button type="button" data-panel="side"><b>3)</b> MAP</button>
      <button type="button" data-cmd="listen to radio"><b>4)</b> RADIO</button>
      <button type="button" data-cmd="hint"><b>5)</b> HINT</button>
      <button type="button" data-cmd="help"><b>6)</b> HELP</button>
    </nav>

    <div class="ticker" aria-hidden="true">
      <span class="tick-label">NEWS · LIVE</span>
      <div class="tick-track"><div class="tick-run" id="tick"></div></div>
    </div>

    <div class="grid">
      <section class="main">
        <div class="panel scene" id="scene">
          <div class="panel-h"><span id="sceneTitle">PLEASE HOLD</span><span class="grow"></span><span id="sceneIdx">LAB · WIP</span></div>
          <div class="art-wrap" id="artWrap"><canvas id="sceneCanvas" aria-hidden="true"></canvas><div id="sceneReadout" class="scene-readout" hidden></div></div>
        </div>

        <div class="panel feed" id="screen">
          <div class="out" id="out" aria-live="polite" aria-relevant="additions" aria-label="Story"></div>
          <div class="chips" id="chips" aria-label="Quick actions"></div>
          <form class="cmd" id="cmd" autocomplete="off">
            <label class="prompt" id="prompt" for="input">guest@nskn:~$</label>
            <input id="input" name="input" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="send" aria-label="Command">
          </form>
        </div>
      </section>

      <aside class="side" id="side" aria-label="Status, map and inventory">
        <button type="button" class="side-close" data-panel="side">CLOSE ✕</button>
        <div class="panel">
          <div class="panel-h">STATUS</div>
          <dl class="status" id="status"></dl>
        </div>
        <div class="panel">
          <div class="panel-h">MAP · NOVI, MI<span class="grow"></span><span class="legend">▮ YOU</span></div>
          <div class="map-wrap"><pre class="map" id="map"></pre></div>
        </div>
        <div class="panel">
          <div class="panel-h">CARRYING</div>
          <ul class="list" id="inv"></ul>
          <div class="panel-h sub">WITH YOU</div>
          <ul class="list" id="party"></ul>
        </div>
      </aside>
    </div>
  </div>
  <div class="flash" id="flash"></div>

  <script src="js/engine.js?v=65a523d5"></script>
  <script src="js/story.js?v=f91d7373"></script>
  <script src="js/art.js?v=6663c6b6"></script>
  <script src="js/scenes.js?v=a42a17bf"></script>
  <script src="js/terminal.js?v=62514341"></script>
</body>
