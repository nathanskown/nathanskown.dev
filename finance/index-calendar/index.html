  renderVals() {
    var S = this.state || {}, self = this, flt = S.flt || 'all';

    var iso = function (d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); };
    var D = function (y, m, d) { return new Date(Date.UTC(y, m - 1, d)); };
    var nthFri = function (y, m, n) { var d = D(y, m, 1), off = (5 - d.getUTCDay() + 7) % 7; return D(y, m, 1 + off + 7 * (n - 1)); };
    var plus = function (d, k) { return new Date(d.getTime() + k * 86400000); };
    var bizNext = function (d) { while (d.getUTCDay() === 0 || d.getUTCDay() === 6) d = plus(d, 1); return d; };
    var today = new Date(); today = D(today.getFullYear(), today.getMonth() + 1, today.getDate());
    var end = plus(today, 366), ev = [];
    var add = function (date, src, title, what, est) { if (date >= today && date <= end) ev.push({ date: date, src: src, title: title, what: what, est: !!est }); };
    for (var y = today.getUTCFullYear(); y <= today.getUTCFullYear() + 1; y++) {
      [3, 6, 9, 12].forEach(function (m) {
        var f3 = nthFri(y, m, 3), mon = plus(f3, 3), f1 = nthFri(y, m, 1);
        add(f1, 'S&P', 'S&P quarterly rebalance: changes usually announced', 'After the close. Lists the stocks joining and leaving the S&P 500, 400 and 600 two weeks later.', true);
        add(f3, 'Options', 'Quarterly options and futures expiration', 'Stock options, index options and futures expire together; index changes are timed to this close.', false);
        add(mon, 'S&P', 'S&P quarterly rebalance takes effect', 'Before the open. Index funds trade the changes at Friday\'s close.', false);
        if (m === 12) {
          add(nthFri(y, 12, 2), 'Nasdaq', 'Nasdaq-100 annual changes announced', 'Usually the second Friday of December, after the close.', true);
          add(mon, 'Nasdaq', 'Nasdaq-100 annual reconstitution takes effect', 'Before the open. The least valuable members can be replaced by the largest non-members.', false);
        }
      });
      [[3, 31], [6, 30], [9, 30], [12, 31]].forEach(function (q) {
        var dl = bizNext(plus(D(y, q[0], q[1]), 45));
        add(dl, '13F', '13F filing deadline for Q' + ([3, 6, 9, 12].indexOf(q[0]) + 1) + ' ' + y, 'Institutional managers report their holdings. The IR view and ownership pages rebuild after the SEC posts the data set.', false);
      });
    }
    // fixed, published schedules
    [[D(2026, 10, 30), 'Russell', 'Russell December reconstitution: rank day', 'Market caps measured at the close decide which stocks move between the Russell 1000, 2000 and microcap.', false],
     [D(2026, 11, 13), 'Russell', 'Russell preliminary add and delete lists', 'Published after the close. Updated weekly until the lockdown.', false],
     [D(2026, 11, 30), 'Russell', 'Russell lockdown begins', 'Lists are final except for corporate actions.', false],
     [D(2026, 12, 11), 'Russell', 'Russell December reconstitution takes effect', 'After the close: index funds trade the whole reshuffle at this close.', false],
     [D(2027, 4, 30), 'Russell', 'Russell June reconstitution: rank day', 'Expected from the usual pattern (April 30); FTSE Russell confirms the schedule each spring.', true],
     [D(2027, 5, 28), 'Russell', 'Russell preliminary lists', 'Expected: the fourth Friday of May, as in 2026.', true],
     [D(2027, 6, 25), 'Russell', 'Russell June reconstitution takes effect', 'Expected: the last Friday of June, after the close. Historically one of the year\'s heaviest trading days.', true],
     [D(2026, 11, 11), 'MSCI', 'MSCI November index review announced', 'Effective Dec. 1, 2026.', false], [D(2026, 12, 1), 'MSCI', 'MSCI November review takes effect', '', false],
     [D(2027, 2, 9), 'MSCI', 'MSCI February index review announced', 'Effective March 1, 2027.', false], [D(2027, 3, 1), 'MSCI', 'MSCI February review takes effect', '', false],
     [D(2027, 5, 10), 'MSCI', 'MSCI May index review announced', 'Effective May 28, 2027.', false], [D(2027, 5, 28), 'MSCI', 'MSCI May review takes effect', '', false],
     [D(2027, 8, 12), 'MSCI', 'MSCI August index review announced', 'Effective Sept. 1, 2027.', false], [D(2027, 9, 1), 'MSCI', 'MSCI August review takes effect', '', false]
    ].forEach(function (x) { add(x[0], x[1], x[2], x[3], x[4]); });
    ev.sort(function (a, b) { return a.date - b.date || (a.src < b.src ? -1 : 1); });
    var COLORS = { 'S&P': '#ffd166', Russell: '#ff8f3d', Nasdaq: '#7fd4ff', MSCI: '#c49bff', '13F': '#4ade80', Options: '#c99442' };
    var srcs = ['all', 'S&P', 'Russell', 'Nasdaq', 'MSCI', '13F', 'Options'];
    var filters = srcs.map(function (k) { var on = k === flt; return { label: k === 'all' ? 'All' : k, on: on ? 'true' : 'false', cls: 't-tab' + (on ? ' is-on' : ''), pick: function () { self.setState({ flt: k }); } }; });
    var shown = ev.filter(function (e) { return flt === 'all' || e.src === flt; });
    var ics = function (e) {
      return function () {
        var d = iso(e.date).replace(/-/g, ''), nd = iso(plus(e.date, 1)).replace(/-/g, '');
        var esc = function (t) { return String(t).replace(/[,;\\]/g, function (c) { return '\\' + c; }); };
        var body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//nathanskown.dev//Index calendar//EN', 'BEGIN:VEVENT', 'UID:' + d + '-' + e.src.replace(/\W/g, '') + '@nathanskown.dev',
          'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z', 'DTSTART;VALUE=DATE:' + d, 'DTEND;VALUE=DATE:' + nd,
          'SUMMARY:' + esc(e.title + (e.est ? ' (expected)' : '')), 'DESCRIPTION:' + esc(e.what + ' From nathanskown.dev/finance/index-calendar/'), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
        var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], { type: 'text/calendar' })); a.download = 'index-event-' + d + '.ics';
        document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      };
    };
    var days = function (d) { var n = Math.round((d - today) / 86400000); return n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days'; };
    var months = [], cur = null;
    shown.forEach(function (e) {
      var label = e.date.toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
      if (!cur || cur.label !== label) { cur = { label: label, items: [] }; months.push(cur); }
      cur.items.push({ d: e.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }), dow: e.date.toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' }),
        src: e.src, title: e.title, what: e.what, est: e.est, in: days(e.date), chip: 'border-color: ' + COLORS[e.src] + '; color: ' + COLORS[e.src],
        ics: ics(e), icsLabel: 'Add ' + e.title + ' to your calendar' });
    });
    var nx = ev[0];
    var log = (S.log || {}).changes || [];
    var changes = log.slice(0, 40).map(function (c) { return { d: F.day(c.date), idx: c.index, name: c.name, sym: c.sym, chg: c.change === 'added' ? '▲ Added' : '▼ Removed', col: c.change === 'added' ? '#4ade80' : '#ff5f56', href: 'IR.dc.html?sym=' + encodeURIComponent(c.sym) }; });
    return { tag: 'NEXT 12 MONTHS', filters: filters, months: months, count: shown.length + ' events',
      next: nx ? { title: nx.title, when: nx.date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }) + ' · ' + days(nx.date) } : { title: '—', when: '' },
      changes: changes, noChanges: !changes.length, chgSub: log.length ? log.length + ' logged' : '' };
  }
}
