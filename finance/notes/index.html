<script>
class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    DC.load('/data/finance/notes/index.json').then(function (ix) {
      self.setState({ ix: ix });
      var want = (self.state || {}).m || ((ix.notes || [])[0] || {}).month;
      if (want) self.open(want);
      else self.setState({ none: true });
    }, function () { self.setState({ none: true }); });
  }
  open(m) {
    var self = this;
    this.setState({ m: m, note: null });
    try { history.replaceState(null, '', '?m=' + m); } catch (e) {}
    DC.load('/data/finance/notes/' + m + '.json').then(function (n) { self.setState({ note: n }); }, function () { self.setState({ none: true }); });
  }
  renderVals() {
    var S = this.state || {}, self = this, N = S.note, ix = (S.ix || {}).notes || [];
    var archive = ix.map(function (n) { var on = n.month === S.m; return { label: n.label.replace(/ \(.*\)$/, '') + (n.partial ? ' · to date' : ''), on: on ? 'true' : 'false', cls: 't-tab' + (on ? ' is-on' : ''), pick: function () { self.open(n.month); } }; });
    return {
      tag: N ? (N.partial ? 'MONTH TO DATE' : 'FINAL') : 'LOADING…', title: N ? N.label.replace(/ \(.*\)$/, '') : 'Data notes',
      lead: N ? N.lead : '', meta: N ? 'Published ' + F.day(N.published) + ' ' + F.time(N.published) + ' ' + window.TZL + (N.partial ? '. A month-to-date edition; the full month replaces it in the first week of next month.' : '.') : '',
      archive: archive, hasArchive: archive.length > 1, none: !!S.none, noneText: 'No notes published yet.',
      sections: N ? N.sections.map(function (s, i) { return { i: i + 1, h: s.h, src: s.src, items: s.items }; }) : [],
      print: function () { window.print(); }
    };
  }
}
DC.mount(Component, {"$preview": {"width": 1440, "height": 2000}});
</script>
