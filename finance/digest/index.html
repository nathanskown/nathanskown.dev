<script>
class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    DC.load('/data/finance/digest.json').then(function (j) { self.setState({ digest: j }); }).catch(function () { self.setState({ err: true }); });
    this.timer = setInterval(function () {
      DC.load('/data/finance/digest.json').then(function (j) { self.setState({ digest: j }); }).catch(function () {});
    }, 300000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    var UP = '#4ade80', DN = '#ff5f56', FLAT = '#ffd89d';
    var st = this.state || {};
    var D = st.digest || {};
    var CT = window.TZ;
    var num = function (v, d) { return v === null || v === undefined || isNaN(v) ? '—' : Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); };
    var sgn = function (v, d, suf) { return v === null || v === undefined || isNaN(v) ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d) + (suf || ''); };
    var col = function (v) { return v === null || v === undefined || isNaN(v) ? FLAT : v > 0 ? UP : v < 0 ? DN : FLAT; };
    var tm = function (iso) { try { return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: CT }); } catch (e) { return ''; } };
    var dateTitle = '';
    try { dateTitle = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', timeZone: CT }); } catch (e) {}
    var money = function (v) { return v === null || v === undefined ? '—' : '$' + Number(v).toFixed(2); };
    var yieldTile = function (f) { return f.tag === 'YLD'; };
    var mk = function (f) {
      var isY = yieldTile(f);
      return { n: f.n, tag: f.tag, v: num(f.price, f.dec === undefined ? 2 : f.dec) + (isY ? '%' : ''),
               chg: isY ? sgn((f.chg || 0) * 100, 0, ' bp') : sgn(f.pct, 2, '%'), color: col(isY ? f.chg : f.pct) };
    };
    var futures = [].concat(D.futures || [], D.macro || [], D.world || []).map(mk);
    var week = {};
    (D.calWeek || []).forEach(function (c) { (week[c.date] = week[c.date] || []).push(c.name); });
    var weekRows = Object.keys(week).sort().map(function (d) {
      var dd = '';
      try { dd = new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }); } catch (e) { dd = d; }
      return { d: dd, e: week[d].join(' · ') };
    });
    var odds = [];
    (D.odds || []).forEach(function (g) {
      (g.markets || []).slice().sort(function (a, b) { return Math.abs(a.pct - 50) - Math.abs(b.pct - 50); }).slice(0, 3).forEach(function (m) {
        var d = m.prev === null || m.prev === undefined ? null : m.pct - m.prev;
        odds.push({ group: g.event || g.title, q: m.label, v: Math.round(m.pct) + '%',
                    bar: 'height: 6px; background: #ffb84d; box-shadow: 0 0 8px rgba(255,184,77,.5); width: ' + Math.max(1, Math.min(100, m.pct)) + '%;',
                    prev: d === null ? 'Change shows after the first full day of readings' : (d === 0 ? 'Unchanged' : (d > 0 ? 'Up ' : 'Down ') + Math.abs(d).toFixed(0) + ' pts vs. prior day (' + Math.round(m.prev) + '%)') });
      });
    });
    var br = D.breadth;
    return {
      crt: this.props.crt ?? true,
      dateTitle: dateTitle,
      updatedLabel: D.updated ? 'Updated ' + tm(D.updated) + ' ' + window.TZL : '',
      liveTag: 'LIVE DATA · DELAYED',
      subtitle: D.updated ? 'Updated ' + tm(D.updated) + ' ' + window.TZL + ' · rebuilt with each market-hours refresh' : 'Loading…',
      missing: !!st.err && !D.updated,
      top5: D.top || [],
      futures: futures,
      calToday: D.calToday || [],
      noCalToday: !!D.updated && !(D.calToday || []).length,
