<script>
class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    DC.load('/data/finance/fed.json').then(function (j) {
      var ms = (j && j.meetings) || [], h = (location.hash || '').replace('#', '');
      var sel = ms.some(function (m) { return m.date === h; }) ? h : (ms.length ? ms[ms.length - 1].date : null);
      self.setState({ fed: j, sel: sel });
      self.live(j);
    }).catch(function () { self.setState({ failed: true }); });
    DC.load('/data/finance/macro.json').then(function (j) { self.setState({ m: j }); }).catch(function () {});
  }
  // while the latest meeting is still being measured, show the move since 2:00 p.m. from live quotes
  live(j) {
    var self = this, ms = (j && j.meetings) || [], m = ms[ms.length - 1];
    if (!m || !m.reaction || m.reaction.final || !m.release || Date.parse(m.release) > Date.now()) return;
    var A = m.reaction.assets || {}, out = {}, n = 0;
    Object.keys(A).forEach(function (k) {
      var a = A[k]; if (!a.base || !a.sym || k === 'us2y') return;
      n++;
      fetch('/api/quote?part=price&sym=' + encodeURIComponent(a.sym)).then(function (r) { return r.ok ? r.json() : null; }).then(function (P) {
        if (P && P.quote && P.quote.price > 0) {
          out[k] = a.unit === 'pct' ? (P.quote.price / a.base - 1) * 100 : (P.quote.price - a.base) * 100;
          out.at = P.quote.time || null;
          self.setState({ liveMoves: Object.assign({}, out) });
        }
      }).catch(function () {});
    });
  }
  renderVals() {
    var UP = '#4ADE80', DN = '#FF5F56', NEU = '#C99442';
    var self = this, st = this.state || {}, J = st.fed || {}, ms = J.meetings || [], M = st.m || {};
    var tz = window.TZ || 'America/New_York', tzl = window.TZL || 'ET';
    var mdate = function (d) { return new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' }); };
    var cur = ms.filter(function (m) { return m.date === st.sel; })[0] || null;
    var shown = ms.filter(function (m) { return m.prev; });           // the baseline statement only serves as the "before"
    var tabs = shown.map(function (m) {
      return { label: mdate(m.date), pressed: m.date === st.sel ? 'true' : 'false',
        pick: function () { try { history.replaceState(null, '', '#' + m.date); } catch (e) {} self.setState({ sel: m.date }); } };
    });
    var mode = st.mode || 'redline';
    var modes = [['redline', 'Redline'], ['clean', 'New text only'], ['prev', 'Previous text']].map(function (x) {
      return { label: x[1], pressed: mode === x[0] ? 'true' : 'false', pick: function () { self.setState({ mode: x[0] }); } };
    });
    var fmt = function (v, unit) {
      if (v === null || v === undefined) return '—';
      var s = unit === 'pct' ? (Math.abs(v) < 0.005 ? '0.00' : Math.abs(v).toFixed(2)) + '%' : (Math.abs(v) < 0.05 ? '0.0' : Math.abs(v).toFixed(1)) + ' bp';
      return (v > 0.0049 ? '+' : v < -0.0049 ? '−' : '') + s;
    };
    var col = function (v) { return v === null || v === undefined ? NEU : (v > 0 ? UP : v < 0 ? DN : NEU); };
    var rows = [], ops = [], points = [], r = cur && cur.reaction, note = '';
    if (cur) {
      var A = (r && r.assets) || {};
      ['spx', 'us10y', 'us2y', 'dxy'].forEach(function (k) {
        var a = A[k]; if (!a) return;
        var ap = k === 'us2y' ? '≈ ' : '';
        var f = function (v) { return v === null || v === undefined ? '—' : ap + fmt(v, a.unit); };
        rows.push({ label: a.label, sub: k === 'us2y' ? '5/30 min and close implied from futures' : (a.unit === 'pct' ? 'percent change' : 'change in basis points'),
          m5: f(a.m5), m30: f(a.m30), close: f(a.close), day: fmt(a.day, a.unit), c5: col(a.m5), c30: col(a.m30), cc: col(a.close), cd: col(a.day) });
      });
      if (r && r.note) note = r.note;
      else if (r && !r.final) note = 'Still being measured: later columns fill in as the session goes on and are finalised the next morning.';
      var base = cur.ops || null;
      if (base) base.forEach(function (o) {
        if (mode === 'clean' && o[0] === '-') return;
        if (mode === 'prev' && o[0] === '+') return;
        ops.push({ t: o[1], cls: mode === 'redline' ? (o[0] === '+' ? 'ins' : o[0] === '-' ? 'del' : '') : '' });
      });
      else (cur.paras || []).forEach(function (p, k) { ops.push({ t: (k ? '\n\n' : '') + p, cls: '' }); });
      points = ((cur.summary && cur.summary.points) || []).map(function (p) { return { topic: p.topic, text: p.text }; });
    }
    var D = cur && cur.decision, PD = cur && cur.prev ? (ms.filter(function (m) { return m.date === cur.prev; })[0] || {}).decision : null;
    var rng = function (d) { return d ? d.range[0].toFixed(2) + '–' + d.range[1].toFixed(2) + '%' : '—'; };
    var change = D && PD ? Math.round((D.range[1] - PD.range[1]) * 100) : 0;
    var V = cur && cur.vote;
    var dissenters = V ? V.against : (cur && cur.votes && /Voting against/.test(cur.votes) ? (cur.votes.split('Voting against')[1].match(/who preferred/g) || []).length : 0);
    var voteText = V ? V.for + '–' + V.against : (cur && cur.votes ? (dissenters ? 'Split' : 'Unanimous') : '—');
    var live = st.liveMoves, liveLine = '';
    if (live && cur && r && !r.final) {
      var bits = [];
      [['spx', 'S&P 500', 'pct'], ['us10y', '10-year yield', 'bp'], ['dxy', 'Dollar index', 'pct']].forEach(function (x) { if (live[x[0]] !== undefined) bits.push(x[1] + ' ' + fmt(live[x[0]], x[2])); });
      liveLine = bits.length ? 'Since 2:00 p.m., on live quotes (delayed up to 15 minutes): ' + bits.join(' · ') + '.' : '';
    }
    var tgt = M.target ? M.target[0].toFixed(2) + '–' + M.target[1].toFixed(2) + '%' : null;
    var nxt = M.fomc ? mdate(M.fomc) : null;
    var days = M.fomc ? Math.round((new Date(M.fomc + 'T12:00:00Z') - new Date(new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' }) + 'T12:00:00Z')) / 86400000) : null;
    var contextBadge = (tgt ? 'Fed funds target ' + tgt : 'Fed funds target —') + (nxt ? ' · next meeting ' + nxt + (days !== null && days >= 0 ? ' (' + (days === 0 ? 'today' : 'in ' + days + ' day' + (days === 1 ? '' : 's')) + ')' : '') : '');
    var lead = ms.length ? 'Every FOMC statement since ' + mdate(shown.length ? shown[0].date : ms[0].date) + ', marked up against the one before it, with what changed in plain English and how stocks, Treasury yields and the dollar moved after the 2:00 p.m. release.' : 'The statements load after the next data refresh.';
    return {
      lead: lead, contextBadge: contextBadge, tz: tzl, tabs: tabs, modes: modes,
      loading: !ms.length && !st.failed, loadText: 'Loading meetings…', ok: !!cur, failed: !!st.failed, failText: 'The Fed statement data is not available right now. It refreshes hourly; check the status page if this persists.',
      dateLabel: cur ? mdate(cur.date) + ' FOMC statement' : '', releaseLabel: cur && cur.release ? 'Released ' + new Date(cur.release).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit', timeZone: tz }) + ' ' + tzl : '',
      decisionText: D ? (D.action === 'hold' ? 'HOLD' : D.action === 'cut' ? 'CUT' : 'HIKE') : '—',
      decisionSub: D && PD ? (change === 0 ? 'No change from the last meeting' : (change < 0 ? 'Down ' : 'Up ') + Math.abs(change) + ' bp from the last meeting') : '',
      rangeText: rng(D), rangeSub: PD ? 'Previous: ' + rng(PD) : '',
      voteText: voteText, voteSub: dissenters ? dissenters + ' dissent' + (dissenters === 1 ? '' : 's') : (V || (cur && cur.votes) ? 'No dissents' : ''),
      summaryHead: cur && cur.summary ? cur.summary.headline : '', points: points, noPoints: !!cur && !points.length,
      prevLabel: cur && cur.prev ? mdate(cur.prev) : 'nothing earlier', ops: ops, noPrev: !!cur && !cur.ops,
      docLabel: cur ? 'FOMC statement of ' + mdate(cur.date) + ' (' + (mode === 'redline' ? 'with tracked changes' : mode === 'clean' ? 'new text' : 'previous text') + ')' : '',
      rows: rows, reactionHead: r && r.final ? 'Final' : (r ? 'In progress' : ''), reactionNote: note, hasNote: !!note, hasLive: !!liveLine, liveLine: liveLine
    };
  }
}
DC.mount(Component, {"$preview": {"width": 1440, "height": 2400}});
</script>
</body>
