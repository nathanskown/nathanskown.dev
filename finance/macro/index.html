      BAMLH0A0HYM2: { label: 'HY spread', name: 'High-yield credit spread (OAS)', id: 'BAMLH0A0HYM2', unit: '%', dec: 2 }
    };
    var H = M.history || {};
    var order = Object.keys(defs).filter(function (k) { return H[k] && H[k].length; });
    if (order.indexOf(sel) < 0 && order.length) sel = order[0];
    var d = defs[sel], obs = H[sel] || [];
    var vals = obs.map(function (o) { return o[1]; });
    var mn = vals.length ? Math.min.apply(null, vals) : 0, mx = vals.length ? Math.max.apply(null, vals) : 1;
    var pad = (mx - mn) * 0.08 || 0.5; mn -= pad; mx += pad;
    var toY = function (v) { return 20 + (1 - (v - mn) / (mx - mn)) * 220; };
    var t0 = obs.length ? new Date(obs[0][0]).getTime() : 0, t1 = obs.length ? new Date(obs[obs.length - 1][0]).getTime() : 1;
    var toX = function (ds) { return (new Date(ds).getTime() - t0) / ((t1 - t0) || 1) * 800; };
    var line = obs.length > 1 ? 'M' + obs.map(function (o) { return toX(o[0]).toFixed(1) + ',' + toY(o[1]).toFixed(1); }).join(' L') : '';
    var f = function (v) { return v === null || v === undefined ? '—' : v.toFixed(d.dec) + d.unit; };
    var recs = (M.recessions || []).filter(function (r) { return obs.length && r[1] >= obs[0][0]; }).map(function (r) {
      var x0 = Math.max(0, toX(r[0])), x1 = Math.min(800, toX(r[1]));
      return { x: x0.toFixed(1), w: Math.max(2, x1 - x0).toFixed(1) };
    });
    var lastV = vals[vals.length - 1], yrAgo = obs.length > 12 ? obs[obs.length - 13][1] : null;
    var notes = {
      UNRATE: function () { return 'Unemployment is ' + f(lastV) + (yrAgo !== null ? ', ' + (lastV >= yrAgo ? 'up' : 'down') + ' ' + Math.abs(lastV - yrAgo).toFixed(1) + ' pts from a year ago.' : '.'); },
      CPI: function () { return 'Consumer prices are up ' + f(lastV) + ' from a year ago' + (lastV > 2 ? ', above the Fed\'s 2% target.' : ', at or below the Fed\'s 2% target.'); },
      FEDFUNDS: function () { return 'The effective fed funds rate averaged ' + f(lastV) + ' last month' + (yrAgo !== null ? ', ' + Math.round((lastV - yrAgo) * 100) + ' bp vs. a year ago.' : '.'); },
      DGS10: function () { return 'The 10-year Treasury yield ended last month at ' + f(lastV) + (yrAgo !== null ? ', ' + Math.round((lastV - yrAgo) * 100) + ' bp vs. a year ago.' : '.'); },
      T10Y2Y: function () { return lastV < 0 ? 'The curve is inverted: 2-year yields sit above 10-year yields, a classic recession warning.' : 'The curve is positively sloped at ' + f(lastV) + ' pts.'; },
      BAMLH0A0HYM2: function () { return 'High-yield spreads are ' + f(lastV) + (lastV < 4 ? ': tight by historical standards, so lenders see little default risk.' : (lastV < 6 ? ': around normal.' : ': wide, a sign of credit stress.')); }
    };
    var seriesTabs = order.map(function (id) {
      var on = id === sel;
      return { label: defs[id].label, pressed: on ? 'true' : 'false', pick: function () { self.setState({ sel: id }); },
        btnStyle: 'height: 36px; padding: 0 12px; border: none; border-radius: 0; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500; ' + (on ? 'background: #FFB84D; color: #000000; text-shadow: none;' : 'background: transparent; color: #C99442;') };
    });
    var badge = function (kind) {
      var c = kind === 'ok' ? ['#0D2616', '#1F6B3A', UP] : ['#2A0F0D', '#7A2A24', DN];
      return 'font-size:13px; font-weight: 600; padding: 2px 10px; border-radius: 0; white-space: nowrap; background: ' + c[0] + '; border: 1px solid ' + c[1] + '; color: ' + c[2] + ';';
    };
    var sig = M.signals || [];
    var warn = sig.filter(function (s) { return s.kind !== 'ok'; });
    var bottom = !sig.length ? 'Signals appear once FRED data loads.' : (warn.length === 0 ? 'None of the ' + sig.length + ' signals is flashing caution right now.' :
      warn.length + ' of ' + sig.length + ' signals are flashing caution: ' + warn.map(function (s) { return s.n.toLowerCase(); }).join(', ') + '.');
    var infl = (M.infl || []).map(function (c) {
      var w = Math.min(Math.abs(c.v) / 10 * 100, 50), pos = c.v >= 0;
      return { n: c.n, v: F.pct(c.v, 1), barStyle: 'position: absolute; top: 0; bottom: 0; border-radius: 0; background: ' + (pos ? '#FFB84D' : '#B8423A') + '; width: ' + w + '%; ' + (pos ? 'left: 50%;' : 'right: 50%;') };
    });
    var hot = (M.infl || []).filter(function (c) { return c.n !== 'All items'; }).sort(function (a, b) { return b.v - a.v; });
    var inflNote = hot.length ? hot[0].n + ' is running hottest at ' + F.pct(hot[0].v, 1) + ' a year; ' + hot[hot.length - 1].n.toLowerCase() + ' is the coolest at ' + F.pct(hot[hot.length - 1].v, 1) + '.' : '';
    var L = M.labor || [];
    var jo = L.filter(function (x) { return x.id === 'JTSJOL'; })[0], qr = L.filter(function (x) { return x.id === 'JTSQUR'; })[0];
    var laborNote = jo && qr ? 'Job openings: ' + jo.now + ' (a year ago ' + jo.prev + '). Quits rate: ' + qr.now + ' (a year ago ' + qr.prev + '). Fewer quits usually means workers feel less confident about finding a new job.' : '';
    var today = new Date(new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' }) + 'T12:00:00Z');
    var calendar = (M.calendar || []).map(function (c) {
      var dd = new Date(c.date + 'T12:00:00Z'), days = Math.round((dd - today) / 86400000);
      var at = c.at ? new Date(c.at).getTime() : null, tm = at ? ' · ' + F.time(at / 1000) + ' ' + window.TZL : '';
      var past = at ? at <= Date.now() : days < 0;
      return { d: dd.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }) + tm, n: c.name,
        p: past ? 'Released' : (days === 0 ? 'Today' : (days === 1 ? 'Tomorrow' : 'In ' + days + ' days')) };
    });
    var tiles = (M.tiles || []).map(function (t) { return { label: t.label, id: t.id, value: t.value, period: t.period, chg: t.chg, color: t.tone === 'good' ? UP : (t.tone === 'bad' ? DN : NEU) }; });
    var un = (M.tiles || []).filter(function (t) { return t.id === 'UNRATE'; })[0], cpi = (M.tiles || []).filter(function (t) { return t.id === 'CPIAUCSL'; })[0], ff = (M.tiles || []).filter(function (t) { return t.id === 'DFF'; })[0];
    var noData = !!M.updated && !(M.tiles || []).length;
    var headline = st.err ? 'Economic data is not available yet. The first daily refresh fills it in.' : noData ? 'FRED did not answer on the last refresh, so there is no economic data to show yet. It fills in on the next daily refresh after the FRED API key is added.' : (M.updated ? [cpi ? 'CPI inflation ' + cpi.value + ' a year' : '', un ? 'unemployment ' + un.value : '', ff ? 'fed funds ' + ff.value : ''].filter(Boolean).join(' · ') + '. ' + bottom : 'Loading…');
    return {
      odds: oddsList, noOdds: !!st.odds && !oddsList.length,
      liveTag: F.updated(M.updated), headline: headline, updatedBadge: M.updated ? 'Updated ' + F.day(M.updated) + ' · ' + F.time(M.updated) + ' ' + window.TZL + (M.keyed ? '' : ' · public CSV') : 'Loading',
      tiles: tiles, seriesTabs: seriesTabs, selName: d.name, selId: d.id, selLast: f(lastV), selNote: obs.length ? notes[sel]() : '', selLine: line, recs: recs,
      zeroStroke: (mn < 0 && mx > 0) ? '#A87933' : 'transparent', zeroY: (mn < 0 && mx > 0) ? toY(0).toFixed(1) : '0',
      yMax: obs.length ? f(mx) : '', yMid: obs.length ? f((mx + mn) / 2) : '', yMin: obs.length ? f(mn) : '', noData: !obs.length,
      signals: sig.map(function (s) { return { n: s.n, id: s.id, detail: s.detail, status: s.status, badgeStyle: badge(s.kind) }; }), bottomLine: bottom,
      infl: infl, inflNote: inflNote, labor: L.map(function (x) { return { n: x.n, now: x.now, prev: x.prev, id: x.id }; }), laborNote: laborNote,
      calendar: calendar, calNote: M.keyed ? 'Market-moving releases, next three weeks · dates from FRED, usual release times' : 'Connect a FRED API key to show the release calendar'
    };
  }
}
