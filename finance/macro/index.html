        btnStyle: 'height: 36px; padding: 0 12px; border: none; border-radius: 0; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500; ' + (on ? 'background: #FFB84D; color: #000000; text-shadow: none;' : 'background: transparent; color: #C99442;')
      };
    });
    var tile = function (label, id, value, period, chg, tone) {
      return { label: label, id: id, value: value, period: period, chg: chg, color: tone === 'good' ? UP : (tone === 'bad' ? DN : NEU) };
    };
    var badge = function (kind) {
      var c = kind === 'ok' ? ['#0D2616', '#1F6B3A', UP] : (kind === 'warn' ? ['#2A0F0D', '#7A2A24', DN] : ['#1A1309', '#4A3517', '#FFB84D']);
      return 'font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 0; white-space: nowrap; background: ' + c[0] + '; border: 1px solid ' + c[1] + '; color: ' + c[2] + ';';
    };
    var sig = function (n2, id, detail, status, kind) { return { n: n2, id: id, detail: detail, status: status, badgeStyle: badge(kind) }; };
    var infl = [['Shelter', 3.6], ['Services ex-shelter', 3.2], ['Food', 2.7], ['Core goods', 1.4], ['All items', 2.9], ['Energy', -1.2]].map(function (c) {
      var w = Math.min(Math.abs(c[1]) / 10 * 100, 50);
      var pos = c[1] >= 0;
      return {
        n: c[0], v: (pos ? '+' : '−') + Math.abs(c[1]).toFixed(1) + '%',
        barStyle: 'position: absolute; top: 0; bottom: 0; border-radius: 0; background: ' + (pos ? '#FFB84D' : '#B8423A') + '; width: ' + w + '%; ' + (pos ? 'left: 50%;' : 'right: 50%;')
      };
    });
    return {
      tiles: [
        tile('CPI inflation (YoY)', 'CPIAUCSL', '2.9%', 'Sep · prior 3.0%', '▼ 0.1 pt', 'good'),
        tile('Core PCE (YoY)', 'PCEPILFE', '2.8%', 'Aug · prior 2.9%', '▼ 0.1 pt', 'good'),
        tile('Unemployment rate', 'UNRATE', '4.4%', 'Sep · prior 4.3%', '▲ 0.1 pt', 'bad'),
        tile('Nonfarm payrolls', 'PAYEMS', '+94K', 'Sep · prior +71K', '3-mo avg +78K', 'neutral'),
        tile('Real GDP (q/q ann.)', 'GDPC1', '+2.1%', 'Q2 · prior +1.4%', '▲ 0.7 pt', 'good'),
        tile('Fed funds (effective)', 'DFF', '3.88%', 'Target 3.75–4.00%', '−100 bp in 12 mo', 'neutral'),
        tile('10-year Treasury', 'DGS10', '4.08%', 'Oct 13', '▼ 3 bp', 'neutral'),
        tile('10Y – 2Y spread', 'T10Y2Y', '+0.47', 'Oct 13', 'Positive since Sep 2024', 'neutral'),
        tile('High-yield spread', 'BAMLH0A0HYM2', '3.12%', 'Oct 10', 'Near historic tights', 'good'),
        tile('Initial jobless claims', 'ICSA', '231K', 'Week of Oct 3', '4-wk avg 228K', 'neutral'),
        tile('Retail sales (MoM)', 'RSAFS', '+0.4%', 'Aug · prior +0.2%', '▲ 0.2 pt', 'good'),
        tile('Consumer sentiment', 'UMCSENT', '57.8', 'Sep · prior 58.4', 'Near record lows', 'bad')
      ],
      seriesTabs: seriesTabs,
      selName: d.name,
      selId: d.id || sel,
      selLast: f(vals[n - 1]),
      selNote: d.note,
      selLine: line,
      recX: toX(2020.08).toFixed(1),
      recW: (toX(2020.33) - toX(2020.08)).toFixed(1),
      zeroStroke: (mn < 0 && mx > 0) ? '#A87933' : 'transparent',
      zeroY: (mn < 0 && mx > 0) ? toY(0).toFixed(1) : '0',
      yMax: f(mx), yMid: f((mx + mn) / 2), yMin: f(mn),
      signals: [
        sig('Sahm rule', 'SAHMREALTIME', 'Reading 0.37 · triggers at 0.50', 'Watch', 'warn'),
        sig('Payroll momentum', 'PAYEMS', '3-month avg below 100K', 'Weak', 'warn'),
        sig('Yield curve', 'T10Y2Y', 'Positive and stable', 'OK', 'ok'),
        sig('Credit spreads', 'BAMLH0A0HYM2', 'HY spread well below 5%', 'OK', 'ok'),
        sig('Jobless claims', 'ICSA', '4-wk avg under 250K', 'OK', 'ok')
      ],
      infl: infl,
      labor: [
        { n: 'Job openings', now: '7.1M', prev: '7.7M', id: 'JTSJOL' },
        { n: 'Quits rate', now: '1.9%', prev: '2.0%', id: 'JTSQUR' },
        { n: 'Avg. hourly earnings (YoY)', now: '+3.7%', prev: '+3.9%', id: 'CES0500000003' },
        { n: 'Labor force participation', now: '62.3%', prev: '62.5%', id: 'CIVPART' },
        { n: 'Continuing claims', now: '1.94M', prev: '1.86M', id: 'CCSA' },
        { n: 'Prime-age employment ratio', now: '80.4%', prev: '80.7%', id: 'LNS12300060' }
      ],
      calendar: [
        { d: 'Wed Oct 14 · 7:30', n: 'Producer Price Index', p: 'Sep', c: '+0.2% MoM', id: 'PPIFIS' },
        { d: 'Thu Oct 15 · 7:30', n: 'Retail sales', p: 'Sep', c: '+0.3% MoM', id: 'RSAFS' },
        { d: 'Thu Oct 15 · 7:30', n: 'Initial jobless claims', p: 'Week of Oct 10', c: '233K', id: 'ICSA' },
        { d: 'Fri Oct 16 · 8:15', n: 'Industrial production', p: 'Sep', c: '+0.1% MoM', id: 'INDPRO' },
        { d: 'Fri Oct 16 · 9:00', n: 'UMich consumer sentiment (prelim)', p: 'Oct', c: '58.2', id: 'UMCSENT' },
        { d: 'Thu Oct 29 · 7:30', n: 'GDP (advance)', p: 'Q3', c: '+1.8% ann.', id: 'GDPC1' },
        { d: 'Fri Oct 30 · 7:30', n: 'PCE price index', p: 'Sep', c: '+2.7% YoY', id: 'PCEPI' },
        { d: 'Fri Nov 6 · 7:30', n: 'Employment situation', p: 'Oct', c: '+85K', id: 'PAYEMS' }
      ]
    };
  }
}
DC.mount(Component, {"$preview": {"width": 1440, "height": 2500}});
