class Component extends DCLogic {
  renderVals() {
    var UP = '#4ADE80', DN = '#FF5F56';

    var self = this;
    var go = function (t) { self.setState({ ticker: String(t || '').trim().toUpperCase() || 'NWND', draft: '' }); };

    var fmtM = function (v) { return Math.abs(v) >= 1 ? v.toFixed(2) + 'M' : Math.round(v * 1000) + 'K'; };
    var fmtVal = function (v) { return v >= 1000 ? '$' + (v / 1000).toFixed(2) + 'B' : '$' + v.toFixed(0) + 'M'; };
    var sgn = function (v, f) { return (v >= 0 ? '+' : '−') + f(Math.abs(v)); };
    var build = function (raw) {
      var top = raw.top.map(function (h, k) {
        var sh = h[2] / 100 * raw.so;
        var isNew = h[3] === 'New';
        return {
          rank: k + 1, n: h[0], style: h[1], sh: fmtM(sh), pct: h[2].toFixed(1) + '%',
          val: fmtVal(sh * raw.px),
          chg: isNew ? 'New position' : sgn(h[3], function (x) { return x.toFixed(1) + '%'; }),
          color: isNew || h[3] >= 0 ? UP : DN
        };
      });
      var mix = raw.mix.map(function (m) {
        var c = mixColors[m[0]];
        return {
          n: m[0], v: m[1].toFixed(1) + '%',
          chg: sgn(m[2], function (x) { return x.toFixed(1) + ' pts'; }), color: m[2] >= 0 ? UP : DN,
          segStyle: 'flex: ' + m[1] + '; background: ' + c + ';',
          dotStyle: 'width: 10px; height: 10px; border-radius: 0; flex: none; background: ' + c + ';'
        };
      });
      var lo = Math.floor(Math.min.apply(null, raw.trend) - 6), hi = Math.ceil(Math.max.apply(null, raw.trend));
      var qs = ["Q3'24", "Q4'24", "Q1'25", "Q2'25", "Q3'25", "Q4'25", "Q1'26", "Q2'26"];
      var trend = raw.trend.map(function (v, k) {
        return { l: qs[k], v: v.toFixed(1) + '%', c: raw.counts[k],
          barStyle: 'width: 100%; border-radius: 0 0 0; height: ' + Math.round((v - lo) / (hi - lo) * 140) + 'px; background: ' + (k === 7 ? '#FFE9C7' : '#6B4E22') + ';' };
      });
      var instChg = raw.trend[7] - raw.trend[6];
      var holdChg = raw.counts[7] - raw.counts[6];
      var net = instChg / 100 * raw.so;
      var top10 = raw.top.reduce(function (a, h) { return a + h[2]; }, 0);
      var idx = raw.mix.filter(function (m) { return m[0] === 'Index'; })[0];

          { label: '13F holders', value: String(raw.counts[7]), sub: sgn(holdChg, String) + ' vs. Q1', color: '#FFD89D' },
          { label: 'Net institutional flow', value: sgn(net, fmtM), sub: 'shares, Q2 vs. Q1', color: net >= 0 ? UP : DN },
          { label: 'New / closed positions', value: raw.newClosed[0] + ' / ' + raw.newClosed[1], sub: 'filers this quarter', color: '#FFD89D' },
          { label: 'Top 10 concentration', value: top10.toFixed(1) + '%', sub: 'of shares outstanding', color: '#FFD89D' },
          { label: 'Index fund share', value: idx[1].toFixed(1) + '%', sub: 'passive ownership', color: '#FFD89D' }
        ],
        trend: trend, mix: mix, top: top,
        buyers: raw.buyers.map(function (b) { return { n: b[0], note: b[2], chg: '+' + fmtM(b[1]) + ' sh' }; }),
        sellers: raw.sellers.map(function (s) { return { n: s[0], note: s[2], chg: '−' + fmtM(s[1]) + ' sh' }; })
      };
    };

      name: 'Northwind Industrial Corp.', so: 80.4, px: 76.10,
      trend: [72.1, 73.0, 72.6, 74.4, 75.0, 76.2, 76.9, 78.4], counts: [412, 418, 421, 430, 437, 441, 452, 468], newClosed: [38, 22],
