      return { label: t.label, pressed: t.id === filt ? 'true' : 'false', pick: function () { self.setState({ filt: t.id }); }, btnStyle: tabStyle(t.id === filt) };
    });
    var reports = (E.recent || []).filter(function (r) { return filt === 'all' || (filt === 'beat' ? r.beat : !r.beat); }).map(function (r) {
      var g = r.lastYearEps ? (r.eps - r.lastYearEps) / Math.abs(r.lastYearEps) * 100 : null;
      var when = r.when === 'BMO' ? 'Before open' : (r.when === 'AMC' ? 'After close' : 'Time not given');
      return { t: r.sym, n: r.name, sector: r.sector || '—', date: F.day(r.date) + ' · ' + when,
        moveLabel: r.moveLive ? 'reaction so far today' : (r.when === 'AMC' ? 'next-session move' : 'report-day move'),
        move: r.move === null || r.move === undefined ? '—' : F.arrow(r.move) + ' ' + F.pct(r.move, 1), moveColor: r.move === null || r.move === undefined ? '#C99442' : (r.move >= 0 ? UP : DN),
        eps: F.usd(r.eps, 2) + ' vs. ' + F.usd(r.est, 2), epsTag: (r.beat ? 'Beat ' : 'Missed ') + F.pct(r.surprisePct, 1), epsColor: r.beat ? UP : DN,
        ly: r.lastYearEps === null || r.lastYearEps === undefined ? '—' : F.usd(r.lastYearEps, 2), growth: g === null ? '' : F.pct(g, 1) + ' YoY', growthColor: (g || 0) >= 0 ? UP : DN,
        nEst: r.nEst ? String(r.nEst) : '—', mcap: F.money(r.mcap, 0) + ' mkt cap',
        newsUrl: 'https://finance.yahoo.com/quote/' + r.sym + '/news', secUrl: 'https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=' + r.sym + '&type=8-K',
        quoteHref: 'Main.dc.html?sym=' + r.sym };
    });
    var todayIso = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
    var ernWatch = st.ernWatch !== undefined ? st.ernWatch : PREFS.get('fin.ernWatch', false);
    var wl = PREFS.get('fin.watch', ['AAPL', 'MSFT', 'NVDA', 'AMZN', 'GOOGL']);
    var upcoming = (E.upcoming || []).filter(function (u) { return !ernWatch || wl.indexOf(u.sym) >= 0; }).map(function (u) {
      var today = u.date === todayIso;
      return { date: F.day(u.date) + (today ? ' · Today' : ''), t: u.sym, href: 'Main.dc.html?sym=' + u.sym, n: u.name, sector: u.sector || '—', when: u.when, eps: u.est === null || u.est === undefined ? '—' : F.usd(u.est, 2),
        nEst: u.nEst ? String(u.nEst) : '—', mcap: F.money(u.mcap, 0), rowStyle: 'text-align: right;' + (today ? ' background: #261C0C;' : '') };
    });
    var subtitle = st.err ? 'Earnings data is not available yet. The first daily refresh fills it in.' : (E.updated ? (P.reported || 0) + ' of ' + (P.total || 500) + ' S&P 500 companies have reported ' + (season.label || '') + ' results. ' + (S.n ? F.n(S.beatPct, 0) + '% beat the consensus EPS estimate, by ' + F.pct(S.avgSurprise, 1) + ' on average.' : 'The season is just getting started.') : 'Loading the season…');
    return {
      liveTag: F.updated(E.updated), title: (season.label || '') + ' earnings season', subtitle: subtitle,
      progressText: (P.reported || 0) + ' of ' + (P.total || 500) + ' · ' + Math.round(pct) + '%', progressBar: 'width: ' + pct.toFixed(1) + '%; height: 8px; background: #FFB84D;',
      weeks: weeks, score: score, sectorRows: sectorRows, themes: themes, raised: TH.raised === undefined ? '—' : String(TH.raised), lowered: TH.lowered === undefined ? '—' : String(TH.lowered),
      themeNote: TH.n ? 'Share of ' + TH.n + ' news headlines (press releases excluded)' + (TH.since ? ' since ' + F.day(TH.since) : '') : 'Builds as headlines accumulate',
      filterTabs: filterTabs, reports: reports, noReports: !!E.updated && !reports.length, upcoming: upcoming,
      ernWatchOn: ernWatch ? 'true' : 'false', ernWatchCls: 't-tab' + (ernWatch ? ' is-on' : ''),
      ernWatchToggle: function () { PREFS.set('fin.ernWatch', !ernWatch); self.setState({ ernWatch: !ernWatch }); }
    };
  }
}
