<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { q: '', models: {}, standings: {} }; }
  componentDidMount() {
    var self = this;
    var lg = String(this.state.lg || this.props.lg || 'nfl').toLowerCase();
    if (!SD.LEAGUES[lg] || !SD.LEAGUES[lg].teams) lg = 'nfl';
    this.setState({ lg: lg });
    SD.data('teams.json').then(function (x) { self.setState({ index: x }); }, function () { self.setState({ err: true }); });
    SD.data('status.json').then(function (x) { self.setState({ status: x }); }, function () {});
    this.loadLeague(lg);
  }
  loadLeague(lg) {
    var self = this;
    if (!this.state.models[lg]) SD.data('model/' + lg + '.json').then(function (m) { var o = Object.assign({}, self.state.models); o[lg] = m; self.setState({ models: o }); }, function () {});
    if (!this.state.standings[lg]) SD.data('standings/' + lg + '.json').then(function (s) {
      var by = {}, i = 0; s.groups.forEach(function (g) { g.teams.forEach(function (r) { by[r.id] = Object.assign({ _pos: i++ }, r); }); });
      var o = Object.assign({}, self.state.standings); o[lg] = by; self.setState({ standings: o });
    }, function () {});
  }
  renderVals() {
    var S = this.state, self = this, lg = S.lg || 'nfl', all = (S.index || {}).leagues || {};
    var LG = ['nfl', 'mlb', 'nhl', 'nba', 'ncaaf', 'ncaab', 'ncaah'];
    var q = (S.q || '').trim().toLowerCase();
    var tabs = LG.map(function (k) {
      return { label: SD.LEAGUES[k].short, n: all[k] ? all[k].length : '', on: k === lg && !q ? 'true' : 'false', cls: 's-tab' + (k === lg && !q ? ' is-on' : ''),
        pick: function () { history.replaceState(null, '', '?lg=' + k); self.setState({ lg: k, q: '' }); self.loadLeague(k); } };
    });
    var row = function (k, t) {
      var st = (S.standings[k] || {})[t.id], m = S.models[k], mt = m && m.teams ? m.teams[t.id] : null;
      var ok = mt && (mt.gp >= (m.minGp || 0) || mt.prior !== undefined);
      return { name: t.short && k.indexOf('ncaa') === 0 ? t.loc || t.short : t.name, href: SD.teamHref(k, t.id), logo: t.logo || '', tag: q ? SD.LEAGUES[k].short : '',
        rec: st ? (st.overall || [st.w, st.l].join('-')) : '', rating: ok ? (mt.rating > 0 ? '+' : '') + mt.rating.toFixed(1) : '' };
    };
    var groups = [];
    if (q) {
      var hits = [];
      LG.forEach(function (k) { (all[k] || []).forEach(function (t) {
        var hay = [t.name, t.loc, t.nick, t.abbr, t.group].join(' ').toLowerCase();
        if (hay.indexOf(q) >= 0) hits.push([k, t]);
      }); });
      if (hits.length) groups.push({ name: hits.length + ' matches', sub: 'all leagues', rCol: 'Rating', teams: hits.slice(0, 120).map(function (h) { return row(h[0], h[1]); }) });
    } else {
      var by = {}, order = [];
      (all[lg] || []).forEach(function (t) { var g = t.group || 'Other'; if (!by[g]) { by[g] = []; order.push(g); } by[g].push(t); });
      order.sort(function (a, b) { return a === 'Other' ? 1 : b === 'Other' ? -1 : a < b ? -1 : 1; });
      groups = order.map(function (g) {
        var st = S.standings[lg] || {}, pos = function (t) { return st[t.id] ? st[t.id]._pos : 1e6; };
        var ts = by[g].slice().sort(function (a, b) { return pos(a) - pos(b) || (a.name < b.name ? -1 : 1); });
        var parent = by[g][0].parent || '';
        return { name: g, sub: parent.replace(/ Conference$/, '').replace('American Football', 'AFC').replace('National Football', 'NFC'), rCol: 'Rating',
          teams: ts.map(function (t) { return row(lg, t); }) };
      });
    }
    var L = SD.LEAGUES[lg];
    return {
      tabs: tabs, q: S.q, groups: groups, onQ: function (e) { self.setState({ q: e.target.value }); },
      title: q ? 'Team search' : L.label + ' teams', statusTag: S.index ? 'LIVE DATA' : (S.err ? 'DATA UNAVAILABLE' : 'LOADING…'),
      note: q ? '' : (all[lg] ? all[lg].length + ' teams. Grouped by ' + (lg.indexOf('ncaa') === 0 ? 'conference' : 'division') + '. Rating is the house model’s margin against an average team; blank until a team has played enough games.' : ''),
      empty: !!S.index && !groups.length, emptyText: q ? 'No team matches “' + S.q + '”.' : 'No teams in this league’s index yet.',
      updated: S.status && S.status.updated ? 'Updated ' + F.day(S.status.updated) + ' ' + F.time(S.status.updated) + ' ' + window.TZL : ''
    };
  }
}
DC.mount(Component, {"lg": {"editor": "text", "default": "nfl"}, "$preview": {"width": 1440, "height": 2400}});
</script>
