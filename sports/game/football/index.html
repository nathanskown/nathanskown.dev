    var gOrder = [], gMap = {};
    inds.forEach(function (r) { if (!gMap[r.cat]) { gMap[r.cat] = { cat: r.cat, rows: [], wsum: 0 }; gOrder.push(r.cat); } gMap[r.cat].rows.push(r); gMap[r.cat].wsum += r.w; });
    var groups = gOrder.map(function (c) { var g = gMap[c]; return { cat: c, rows: g.rows, w: g.wsum ? g.wsum + '% of model' : 'context only' }; });
    var take = raw.take || { pick: '', margin: '', win: '', fair: '', drivers: [], cover: '' };
    var pickT = teamFor(take.pick);
    var conf = coverage >= 80 ? 'High confidence' : (coverage >= 60 ? 'Moderate confidence' : 'Lean only');
    var prob = raw.prob;
    var jump = isRecap
      ? [{ t: 'Game flow', href: '#flow' }, { t: 'Box score', href: '#box' }, { t: 'Team stats', href: '#stats' }, { t: 'Scoring', href: '#plays' }]
      : [{ t: 'Takeaway', href: '#edge' }, { t: 'Key metrics', href: '#metrics' }, { t: 'Projection', href: '#model' }, { t: 'Unit vs. unit', href: '#units' }, { t: 'Form', href: '#form' }, { t: 'Context', href: '#context' }, { t: 'Injuries', href: '#injuries' }];
    var feedProb = raw.feed ? (raw.feedTeam + ' ' + Math.round(raw.feed) + '%') : '[XX%]';
    var favA = prob && prob[0] > prob[1];

    return {
      navCls: navCls,
      lgShort: data.lgShort, modes: modes, cur: cur, away: away, home: home, jump: jump,
      isRecap: isRecap, isPreview: !isRecap,
      awayColor: aWin === false ? '#3C9AA3' : '#C8F7FC', homeColor: aWin === true ? '#3C9AA3' : '#C8F7FC',
      probA: prob ? raw.away.abbr + ' ' + Math.round(prob[0]) + '%' : '[XX%]', probB: prob ? raw.home.abbr + ' ' + Math.round(prob[1]) + '%' : '[XX%]',
      probAColor: favA ? '#C8F7FC' : '#5CC7D1', probBColor: favA ? '#5CC7D1' : '#C8F7FC',
      probBarA: 'flex: ' + (prob ? prob[0] : 50) + '; background: ' + raw.away.bg + ';', probBarB: 'flex: ' + (prob ? prob[1] : 50) + '; background: ' + raw.home.bg + ';',
      feedProb: feedProb,
      edges: edges, edgeTally: edgeTally, forms: forms, ctx: ctx,
      keyRows: keyRows, groups: groups, indCount: inds.length, keyCount: keyRows.length, showAll: showAll,
      allExpanded: showAll ? 'true' : 'false', toggleLabel: showAll ? 'Hide full indicator list' : 'Show all ' + inds.length + ' indicators',
      toggleAll: function () { self.setState({ showAll: !showAll }); },
      tally: 'Weighted edge (live): ' + raw.away.abbr + ' ' + tw.a + '% · ' + raw.home.abbr + ' ' + tw.b + '% · even ' + tw.even + '%',
      coverage: coverage, confidence: conf,
      coverageBar: 'height: 8px; width: ' + coverage + '%; border-radius: 0; background: ' + (coverage >= 60 ? '#4ADE80' : '#C9A96E') + ';',
      take: { pick: take.pick, margin: take.margin, win: take.win, fair: take.fair, cover: take.cover, drivers: (take.drivers || []).map(function (t, i) { return { t: t, n: i + 1 }; }) },
      pickMini: pickT ? mini(pickT) : neutralMini, pickName: pickT ? pickT.name : '',
      lineHeaders: lineHeaders, lineRows: lineRows, stats: stats, moments: moments,
      hasFlow: hasFlow, flowPath: flowPath, flowArea: flowArea, flowTicks: flowTicks, flowLabels: flowLabels, flowTop: flowTop, flowBot: flowBot, flowNote: flowNote, flowAria: flowAria
    };
  }
}
