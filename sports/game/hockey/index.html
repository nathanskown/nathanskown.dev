<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { loading: true }; }

  componentDidMount() {
    var lg = String(this.state.lg || this.props.lg || 'nfl').toLowerCase();
    if (!SD.LEAGUES[lg] || !SD.LEAGUES[lg].teams) lg = 'nfl';
    var id = String(this.state.id || this.props.id || '');
    this.lg = lg; this.gid = id;
    var self = this;
    SD.data('model/' + lg + '.json').then(function (m) { self.setState({ model: m }); }, function () {});
    SD.data('teams.json').then(function (x) { self.setState({ index: x }); }, function () {});
    if (!id) this.loadBoard(); else this.load();
  }
  componentWillUnmount() { clearTimeout(this.timer); }

  loadBoard() {
    var self = this;
    SD.scores(this.lg).then(function (b) {
      self.setState({ loading: false, board: b });
      var live = b.events.some(function (e) { return e.state === 'in'; });
      clearTimeout(self.timer); self.timer = setTimeout(function () { self.loadBoard(); }, live ? 30000 : 300000);
    }, function () { self.setState({ loading: false, err: true }); });
  }
  load() {
    var self = this;
    SD.summary(this.lg, this.gid).then(function (g) {
      self.setState({ loading: false, g: g, err: false });
      if (g.state === 'in') { clearTimeout(self.timer); self.timer = setTimeout(function () { self.load(); }, 30000); }
      else if (g.state === 'pre') { clearTimeout(self.timer); self.timer = setTimeout(function () { self.load(); }, 300000); }
    }, function () { self.setState({ loading: false, err: true }); });
  }

  renderVals() {
    var S = this.state, lg = this.lg || 'nfl', L = SD.LEAGUES[lg];
    var lgLinks = ['nfl', 'mlb', 'nhl', 'nba', 'ncaaf', 'ncaab', 'ncaah'].map(function (k) { return { label: SD.LEAGUES[k].short, href: 'Game.dc.html?lg=' + k, cls: 't-chipl' + (k === lg ? ' is-on' : '') }; });
    var idx = {}; (((S.index || {}).leagues || {})[lg] || []).forEach(function (t) { idx[t.id] = t; });
    var logo = function (t) { return (idx[t.id] || {}).logo || ''; };
    var stStyle = function (st) { return st === 'in' ? 'color: var(--live); font-weight: 600' : 'color: var(--dim)'; };
    var base = { lgLinks: lgLinks, lgLabel: L.label, lgHref: 'Teams.dc.html?lg=' + lg };

    if (!this.gid) {
      var evs = S.board ? S.board.events : [];
      var rank = { 'in': 0, pre: 1, post: 2 };
      evs = evs.slice().sort(function (a, b) { return (rank[a.state] - rank[b.state]) || (a.start < b.start ? -1 : 1); });
      return Object.assign(base, { picker: true, ok: false, statusTag: S.loading ? 'LOADING…' : 'PICK A GAME',
        pick: { title: L.label + ' games', note: S.board && S.board.week ? 'Week ' + S.board.week : 'Current slate', empty: !S.loading && !evs.length,
          emptyText: S.err ? 'The live feed did not respond. Try again in a minute.' : 'No ' + L.label + ' games on the current slate.',
          games: evs.map(function (e) {
            var pre = e.state === 'pre';
            return { href: e.href, away: (e.away.rank ? e.away.rank + ' ' : '') + e.away.short, home: (e.home.rank ? e.home.rank + ' ' : '') + e.home.short,
              as: pre ? '' : e.away.score, hs: pre ? '' : e.home.score, aLogo: logo(e.away), hLogo: logo(e.home),
              status: pre ? F.day(e.start) + ' · ' + F.time(e.start) + ' ' + window.TZL + (e.tv ? ' · ' + e.tv : '') : e.detail, stStyle: stStyle(e.state) };
          }) } });
    }

    var g = S.g;
    if (!g) return Object.assign(base, { picker: false, ok: false, statusTag: S.err ? 'FEED UNAVAILABLE' : 'LOADING…', waiting: true, lgPick: 'Game.dc.html?lg=' + lg,
      waitText: S.err ? 'The live feed for this game did not respond. It may be too old or not posted yet; try again in a minute.' : 'Loading the game…' });
    if (typeof document !== 'undefined') document.title = (g.away ? g.away.abbr : '') + ' at ' + (g.home ? g.home.abbr : '') + ' · NSKN Terminal';
    var A = g.away || {}, H = g.home || {};
    var pre = g.state === 'pre';
    var side = function (t) {
      return { name: t.name || t.short || 'TBD', abbr: t.abbr || '', logo: logo(t) || '', href: t.href || '#', sub: [t.rank ? 'No. ' + t.rank : '', t.record].filter(Boolean).join(' · ') };
    };
