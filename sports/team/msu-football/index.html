class Component extends DCLogic {
  constructor(props) { super(props); this.state = { loading: true, showAllRes: false, showAllUp: false }; }

  componentDidMount() {
    var s = this.state, lg = String(s.lg || this.props.lg || '').toLowerCase(), id = String(s.id || this.props.id || '');
    if (!lg || !id || !SD.LEAGUES[lg] || !SD.LEAGUES[lg].teams) { this.setState({ loading: false, bad: true }); return; }
    this.lg = lg; this.tid = id;
    var self = this, pro = ['nfl', 'mlb', 'nhl', 'nba'].indexOf(lg) >= 0;
    var soft = function (p) { return p.then(function (x) { return x; }, function () { return null; }); };
    Promise.all([soft(SD.data('teams.json')), soft(SD.data('model/' + lg + '.json')), soft(SD.data('standings/' + lg + '.json')),
      pro ? soft(SD.data('injuries/' + lg + '.json')) : null, pro ? soft(SD.data('leaders/' + lg + '.json')) : null, soft(SD.data('status.json'))])
      .then(function (r) {
        self.setState({ index: r[0], model: r[1], standings: r[2], injuries: r[3], leadersData: r[4], status: r[5] });
        return self.loadSchedule();
      });
  }
  componentWillUnmount() { clearTimeout(this.timer); }

  loadSchedule() {
    var self = this, lg = this.lg, id = this.tid, m = this.state.model;
    var base = m && m.season ? { season: m.season } : {};
    var get = function (st) { return SD.schedule(lg, id, Object.assign({ seasontype: st }, base)).then(function (x) { return x; }, function () { return null; }); };
    return Promise.all([get(2), get(3)]).then(function (r) {
      var reg = r[0], post = r[1];
      if (!reg && !post) { self.setState({ loading: false, schedErr: true }); return; }
      var seen = {}, games = [];
      [reg, post].forEach(function (x) { (x ? x.games : []).forEach(function (g) { if (!seen[g.id]) { seen[g.id] = 1; games.push(g); } }); });
      games.sort(function (a, b) { return a.start < b.start ? -1 : 1; });
      var head = (post && post.games.length && post.team.record) ? post.team : (reg || post).team;
      self.setState({ loading: false, sched: { team: head, regTeam: (reg || post).team, games: games, bye: (reg || {}).bye } });
      var live = games.some(function (g) { return g.state === 'in'; });
      clearTimeout(self.timer);
      self.timer = setTimeout(function () { self.loadSchedule(); }, live ? 60000 : 600000);
      var last = games.filter(function (g) { return g.done; }).pop();
      if (last && !self.state.lastSummary && !(self.state.leadersData && self.state.leadersData.teams && self.state.leadersData.teams[id])) {
        SD.summary(lg, last.id).then(function (sm) { self.setState({ lastSummary: sm, lastGame: last }); }, function () {});
      }
    });
  }

  renderVals() {
    var S = this.state, lg = this.lg || String(S.lg || this.props.lg || ''), id = this.tid || String(S.id || this.props.id || '');
    var L = SD.LEAGUES[lg] || {};
    var favs = SD.favChips(lg, id), self = this;
    var lgLinks = ['nfl', 'mlb', 'nhl', 'nba', 'ncaaf', 'ncaab', 'ncaah'].map(function (k) { return { label: SD.LEAGUES[k].short, href: 'Teams.dc.html?lg=' + k, cls: 't-chipl' + (k === lg ? ' is-on' : '') }; });
    var base = { favs: favs, lgLinks: lgLinks, updated: S.status && S.status.updated ? 'Data files updated ' + F.day(S.status.updated) + ' ' + F.time(S.status.updated) + ' ' + window.TZL : 'Live data' };
    if (S.bad) return Object.assign(base, { missing: true, ok: false, statusTag: 'NO TEAM SELECTED', missingText: 'Pick a team to see its page.' });
    if (S.schedErr && !S.index) return Object.assign(base, { missing: true, ok: false, statusTag: 'FEED UNAVAILABLE', missingText: 'The live feed did not respond. Try again in a minute.' });

    var idx = ((S.index || {}).leagues || {})[lg] || [];
    var me = idx.filter(function (x) { return x.id === id; })[0] || {};
    var sched = S.sched || null, st = sched ? sched.team : {};
    var model = S.model, mt = model && model.teams ? model.teams[id] : null;
    var teamN = model && model.teams ? Object.keys(model.teams).length : 0;
    var color = '#' + String(me.color || (st.color || '#12363B')).replace('#', '');
    var pick = function (g) { return g.opp || {}; };
    var name = me.name || st.name || (S.loading ? 'Loading…' : 'Team ' + id);
    if (typeof document !== 'undefined' && name && !S.loading) document.title = name + ' · NSKN Terminal';

    // standings row for this team
    var group = null, row = null;
    ((S.standings || {}).groups || []).forEach(function (g) { g.teams.forEach(function (r) { if (r.id === id) { group = g; row = r; } }); });

    var sign = function (v, d) { if (v === null || v === undefined || isNaN(v)) return '—'; return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d === undefined ? 1 : d); };
    var pct = function (p) { return p === null || p === undefined ? '—' : (p >= 0.995 ? '>99%' : p < 0.005 ? '<1%' : Math.round(p * 100) + '%'); };
    var unit = model ? model.unit : (L.unit || 'pts');
    var enough = function (t) { return t && (t.gp >= (model.minGp || 0) || t.prior !== undefined); };

    var t = {
      name: name, logo: me.logo || '', logoAlt: name + ' logo', lgLabel: L.label || lg.toUpperCase(), lgHref: 'Teams.dc.html?lg=' + lg,
      group: me.group || (group ? group.name : ''),
      record: st.record || (row && row.overall) || (S.loading ? '' : '0-0'),
      standing: st.standing || (sched && sched.regTeam ? sched.regTeam.standing : '') || '',
      bandStyle: 'background: radial-gradient(900px 320px at 12% 40%, ' + color + 'cc, transparent 70%), linear-gradient(100deg, ' + color + '66 0%, ' + color + '18 55%, transparent 80%), linear-gradient(180deg, transparent 50%, #03070c 100%), #03070c;',
      rankLine: mt && enough(mt) ? 'House rating ' + sign(mt.rating) + ' ' + unit + ' vs. an average team · No. ' + mt.rank + ' of ' + teamN : ''
    };

    // games
    var games = sched ? sched.games : [];
    var now = Date.now();
    var dlabel = function (iso) { return F.day(iso); };
    var gameRow = function (g) {
      var o = pick(g), at = g.neutral ? 'vs' : (g.home ? 'vs' : 'at');
      var note = [g.season && !/regular/i.test(g.season) ? g.season : '', g.week && L.sport === 'football' ? 'Week ' + String(g.week).replace(/^Week\s*/i, '') : '', g.neutral ? 'Neutral site' : ''].filter(Boolean).join(' · ');
      return { d: dlabel(g.start), at: at, opp: o.name || o.short || 'TBD', oppHref: o.href || '#', href: g.href, aria: 'Game page: ' + (g.home ? '' : 'at ') + (o.name || ''), note: note, g: g, o: o };
    };
    var done = games.filter(function (g) { return g.done || g.state === 'post'; });
    var live = games.filter(function (g) { return g.state === 'in'; });
    var up = games.filter(function (g) { return g.state === 'pre' && !g.done; });
    var resultsAll = live.concat(done.slice().reverse()).map(function (g) {
      var r = gameRow(g);
      r.res = g.state === 'in' ? 'LIVE' : (g.result || '·');
      r.resCls = 's-res ' + (g.state === 'in' ? 'x' : (g.result || 'x'));
      r.score = g.score || g.detail || '';
      if (g.state === 'in') r.note = (g.detail || 'In progress') + (r.note ? ' · ' + r.note : '');
      else if (g.score === '' && g.detail) r.note = g.detail;
      return r;
    });
    var results = S.showAllRes ? resultsAll : resultsAll.slice(0, 8);
    var upAll = up.map(function (g) {
      var r = gameRow(g), o = r.o;
      var p = model ? SD.project(model, g.home ? o.id : id, g.home ? id : o.id, g.neutral, g.start) : null;
      var mo = model && model.teams ? model.teams[o.id] : null;
      var useP = p && enough(mt) && enough(mo);
      r.prob = useP ? Math.round((g.home ? p.pHome : p.pAway) * 100) + '%' : '';
      var tm = /T00:00Z$|T0[45]:00Z$/.test(g.start) && g.detail && /TBD|TBA/i.test(g.detail) ? 'TBD' : F.time(g.start);
      r.note = [tm, g.tv, r.note].filter(Boolean).join(' · ');
      return r;
    });
    var upcoming = S.showAllUp ? upAll : upAll.slice(0, 8);

    // next game card
    var nx = live[0] || up[0];
    var next = { title: 'NEXT UP', line: S.loading ? 'Loading schedule…' : 'No games scheduled', sub: '', prob: '', href: '', cta: 'Game preview' };
    if (nx) {
      var nr = gameRow(nx), o2 = nr.o;
      next.title = nx.state === 'in' ? 'LIVE NOW' : 'NEXT UP';
      next.line = (nx.home || nx.neutral ? 'vs ' : 'at ') + (o2.name || 'TBD');
      next.sub = nx.state === 'in' ? (nx.score + ' · ' + nx.detail) : [new Date(nx.start).toLocaleDateString('en-US', { timeZone: window.TZ, weekday: 'short', month: 'short', day: 'numeric' }), F.time(nx.start) + ' ' + window.TZL, nx.tv].filter(Boolean).join(' · ');
      var pp = model ? SD.project(model, nx.home ? o2.id : id, nx.home ? id : o2.id, nx.neutral, nx.start) : null;
      var mo2 = model && model.teams ? model.teams[o2.id] : null;
      if (pp && nx.state !== 'in' && enough(mt) && enough(mo2)) {
        var mine = nx.home ? pp.pHome : pp.pAway, mm = nx.home ? pp.margin : -pp.margin;
        next.prob = 'House model: ' + Math.round(mine * 100) + '% to win · projected margin ' + sign(mm) + ' ' + unit;
      }
      next.href = nx.href; next.cta = nx.state === 'in' ? 'Live game page' : 'Game preview';
    } else if (sched && sched.bye) {
      next.sub = 'Bye week ' + sched.bye.number;
    }

    // margins chart (completed games, oldest first, last 16)
    var mg = done.filter(function (g) { return g.score && g.me && g.opp; }).slice(-16);
    var mx = 1; var diffs = mg.map(function (g) { var d = Number(g.me.score) - Number(g.opp.score); mx = Math.max(mx, Math.abs(d)); return d; });
    var margins = mg.map(function (g, i) {
      var d = diffs[i], h = Math.max(4, Math.abs(d) / mx * 100);
      return { href: g.href, title: (g.home ? 'vs ' : 'at ') + (g.opp.abbr || g.opp.name) + ' ' + g.score + ' (' + F.day(g.start) + ')',
        up: d > 0 ? 'display: block; width: 70%; height: ' + h.toFixed(0) + '%; background: var(--up)' : 'display: none',
        down: d < 0 ? 'display: block; width: 70%; height: ' + h.toFixed(0) + '%; background: var(--dn)' : (d === 0 ? 'display: block; width: 70%; height: 3px; background: var(--dim)' : 'display: none') };
    });

    // profile tiles
    var profile = [];
    if (mt) {
      var ok = enough(mt);
      profile.push({ k: 'House rating', v: ok ? sign(mt.rating) : '—', s: ok ? unit + ' vs. average · No. ' + mt.rank + ' of ' + teamN : 'Shows after ' + model.minGp + ' games', style: mt.rating > 0.05 ? 'color: var(--up)' : mt.rating < -0.05 ? 'color: var(--dn)' : '' });
      if (mt.mov !== undefined) profile.push({ k: 'Avg margin', v: sign(mt.mov), s: unit + ' per game · ' + mt.gp + ' games', style: '' });
      if (mt.sos !== undefined) profile.push({ k: 'Opponent strength', v: sign(mt.sos), s: 'Avg rating of teams played', style: '' });
      if (mt.prior !== undefined && !mt.gp) profile.push({ k: 'Starting point', v: sign(mt.prior), s: 'From last season (see method)', style: '' });
    }
    if (row) {
      [['Home', row.home], ['Road', row.road], [lg.indexOf('ncaa') === 0 ? 'Conference' : 'vs. Conference', row.conf], ['vs. Division', row.div], ['Last 10', row.l10], ['Streak', row.streak]]
        .forEach(function (x) { if (x[1] && x[1] !== '-') profile.push({ k: x[0], v: String(x[1]).split(',')[0], s: '', style: '' }); });
    }
    if (!profile.length) profile.push({ k: 'Record', v: t.record || '—', s: S.loading ? 'Loading…' : 'No games yet this season', style: '' });

    // standings table
    var stv = { title: group ? group.name : 'Standings', allHref: 'Teams.dc.html?lg=' + lg, has: false, none: false, noneText: '', cols: [], rows: [] };
    if (group) {
      var cols, cells;
      if (lg === 'nhl') { cols = ['GP', 'W', 'L', 'OTL', 'PTS', 'DIFF']; cells = function (r) { return [r.gp, r.w, r.l, r.otl, r.pts, r.diff]; }; }
      else if (lg === 'nfl') { cols = ['W', 'L', 'T', 'PCT', 'DIFF', 'STRK']; cells = function (r) { return [r.w, r.l, r.t || 0, r.pct !== undefined ? Number(r.pct).toFixed(3).replace(/^0/, '') : '', r.diff, r.streak]; }; }
      else if (lg.indexOf('ncaa') === 0) { cols = ['CONF', 'OVERALL', 'HOME', 'AWAY', 'STRK']; cells = function (r) { return [r.conf, r.overall, r.home, r.road, r.streak]; }; }
      else { cols = ['W', 'L', 'PCT', 'GB', 'L10', 'STRK']; cells = function (r) { return [r.w, r.l, r.pct !== undefined ? Number(r.pct).toFixed(3).replace(/^0/, '') : '', r.gb, r.l10, r.streak]; }; }
      stv.cols = cols; stv.has = true;
      stv.rows = group.teams.map(function (r) { return { name: r.short || r.name, logo: r.logo || '', href: SD.teamHref(lg, r.id), cls: r.id === id ? 'me' : '', cells: cells(r).map(function (c) { return c === undefined || c === null || c === '-' ? '—' : String(c); }) }; });
    } else { stv.none = true; stv.noneText = S.standings ? 'This team is not in the current standings file.' : 'Standings load from the hourly data refresh.'; }

    // outlook
    var odds = [], on = model && model.odds ? model.odds[id] : null, outlookNote;
    if (on) {
      if (lg === 'nfl') odds = [{ k: 'Make playoffs', v: pct(on.playoff), s: '' }, { k: 'Win division', v: pct(on.div), s: '' }, { k: 'No. 1 seed', v: pct(on.seed1), s: '' }, { k: 'Win Super Bowl', v: pct(on.title), s: '' }, { k: 'Projected wins', v: on.wins.toFixed(1), s: '80% range ' + on.w10 + '–' + on.w90 }];
      else odds = [{ k: 'Make playoffs', v: pct(on.playoff), s: '' }].concat(on.div !== undefined ? [{ k: 'Win division', v: pct(on.div), s: '' }] : []).concat([{ k: 'Win conference', v: pct(on.conf), s: '' }, { k: 'Win Stanley Cup', v: pct(on.title), s: '' }, { k: 'Projected points', v: on.pts.toFixed(0), s: '80% range ' + on.p10 + '–' + on.p90 }]);
      outlookNote = model.oddsBasis;
    } else if (!model) outlookNote = 'The house model file has not loaded.';
    else if (lg === 'nfl' || lg === 'nhl') outlookNote = 'Season simulations are not available right now (' + (model.oddsBasis || 'not run') + ').';
    else outlookNote = 'Season simulations run for the NFL and NHL. For ' + (L.label || lg) + ', the house model gives a rating and a win probability for each game (see the schedule).';
    if (model && model.basis) outlookNote += ' Ratings: ' + model.basis;

    // injuries
    var injRows = S.injuries && S.injuries.teams ? (S.injuries.teams[id] || []) : null;
    var stCol = function (s) { return /out|reserve|suspen/i.test(s || '') ? 'color: var(--dn)' : /doubt|question|day/i.test(s || '') ? 'color: #ffd166' : ''; };
    var inj = (injRows || []).filter(function (i) { return !/^active$/i.test(i.status || ''); }).map(function (i) { return { name: i.name, pos: i.pos || '', part: [i.side, i.part].filter(Boolean).join(' ') || '—', status: i.status || '—', style: stCol(i.status), ret: i.ret ? F.day(i.ret) : '—' }; });
    var pro = ['nfl', 'mlb', 'nhl', 'nba'].indexOf(lg) >= 0;
    var injNote = pro ? 'ESPN injury feed' : '';
    var noInjText = !pro ? 'ESPN does not publish injury reports for college teams, so there is no free feed to show here.' : (injRows === null ? 'Injury report loads from the hourly data refresh.' : 'No injuries listed.');

    // leaders
    var ld = S.leadersData && S.leadersData.teams ? S.leadersData.teams[id] : null, leaders = [], ldTitle = 'Season leaders', ldNote = '', noLeadersText = '';

    } else if (S.lastSummary) {
      var mineL = (S.lastSummary.leaders || []).filter(function (x) { return x.team === id; })[0];
      if (mineL) {
        ldTitle = 'Last game leaders';
        ldNote = (S.lastGame.home ? 'vs ' : 'at ') + ((S.lastGame.opp || {}).abbr || '') + ' · ' + F.day(S.lastGame.start);
        leaders = mineL.cats.map(function (c) { return { k: c.cat, p: c.name, pos: '', v: c.line }; });
      }
    }
    if (!leaders.length) noLeadersText = S.loading ? 'Loading…' : (pro ? 'Leaders load from the daily data refresh.' : 'No completed games with box scores yet.');

    return Object.assign(base, {
      ok: true, missing: false, statusTag: S.loading ? 'LOADING…' : (live.length ? 'LIVE GAME' : 'DATA'), t: t, next: next,
      profile: profile, profileNote: mt && model ? 'House rating from ' + (model.games || 'all') + ' games this season' : '',
      margins: margins, hasMargins: margins.length > 1, marginAria: 'Bar chart of game margins: ' + diffs.join(', '),
      results: results, noResults: !S.loading && !resultsAll.length, noResultsText: S.schedErr ? 'The live schedule feed did not respond.' : 'No completed games yet this season.',
      resNote: done.length ? done.length + ' played' : '', moreResults: resultsAll.length > 8, moreResultsLabel: S.showAllRes ? 'Show fewer' : 'Show all ' + resultsAll.length,
      toggleRes: () => this.setState({ showAllRes: !S.showAllRes }),
      upcoming: upcoming, noUpcoming: !S.loading && !upAll.length, noUpcomingText: S.schedErr ? 'The live schedule feed did not respond.' : 'No upcoming games on the schedule.',
      upNote: model && upAll.length ? 'Right column: house win probability' : '', moreUpcoming: upAll.length > 8, moreUpcomingLabel: S.showAllUp ? 'Show fewer' : 'Show all ' + upAll.length,
      toggleUp: () => this.setState({ showAllUp: !S.showAllUp }),
      st: stv, odds: odds, hasOdds: odds.length > 0, outlookNote: outlookNote,
      inj: inj, hasInj: inj.length > 0, noInj: !inj.length, noInjText: noInjText, injNote: injNote,
      leaders: leaders, noLeaders: !leaders.length, noLeadersText: noLeadersText, ldTitle: ldTitle, ldNote: ldNote,
      followOn: SD.isFollowed(lg, id) ? 'true' : 'false', followLabel: SD.isFollowed(lg, id) ? '★ FOLLOWING' : '☆ FOLLOW',
      followCls: 's-btn' + (SD.isFollowed(lg, id) ? '' : ' s-off'),
      followToggle: function () { SD.toggleFollow(lg, id, t.name || ''); self.setState({ fv: Date.now() }); }
    });
  }
}
