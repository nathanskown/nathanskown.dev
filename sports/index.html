      var on = c.id === lg;
      return {
        label: c.label, pressed: on ? 'true' : 'false',
        pick: function () { self.setState({ lg: c.id }); },
        btnStyle: 'height: 44px; padding: 0 16px; border: none; border-radius: 0; cursor: pointer; font-family: IBM Plex Mono, ui-monospace, monospace; font-size: 14px; font-weight: 500; ' + (on ? 'background: #66E6F2; color: #000000; text-shadow: none;' : 'background: transparent; color: #4FB8C2;')
      };

    var TEAMPAGE = { 'nfl:DET': 'Team.dc.html', 'mlb:DET': 'TeamTigers.dc.html', 'nhl:DET': 'TeamRedWings.dc.html', 'nba:DET': 'TeamPistons.dc.html', 'ncaaf:MSU': 'TeamMSUFootball.dc.html', 'ncaab:MSU': 'TeamMSUBasketball.dc.html' };

    var W = '#EAFDFF';
    var COLORS = {
      'nfl:ARI': ['#97233F', W], 'nfl:ATL': ['#A71930', W], 'nfl:BAL': ['#241773', W], 'nfl:BUF': ['#00338D', W], 'nfl:CAR': ['#0085CA', W], 'nfl:CHI': ['#0B162A', '#C83803'],
      'nfl:CIN': ['#FB4F14', '#000000'], 'nfl:CLE': ['#311D00', '#FF3C00'], 'nfl:DAL': ['#003594', W], 'nfl:DEN': ['#FB4F14', '#002244'], 'nfl:DET': ['#0076B6', W], 'nfl:GB': ['#203731', '#FFB612'],
      'nfl:HOU': ['#03202F', '#A71930'], 'nfl:IND': ['#002C5F', W], 'nfl:JAC': ['#006778', '#D7A22A'], 'nfl:KC': ['#E31837', '#FFB81C'], 'nfl:LV': ['#000000', '#A5ACAF'], 'nfl:LAC': ['#0080C6', '#FFC20E'],
      'nfl:LA': ['#003594', '#FFD100'], 'nfl:MIA': ['#008E97', W], 'nfl:MIN': ['#4F2683', '#FFC62F'], 'nfl:NE': ['#002244', '#C60C30'], 'nfl:NO': ['#D3BC8D', '#101820'], 'nfl:NYG': ['#0B2265', W],
      'nfl:NYJ': ['#125740', W], 'nfl:PHI': ['#004C54', W], 'nfl:PIT': ['#FFB612', '#101820'], 'nfl:SF': ['#AA0000', '#B3995D'], 'nfl:SEA': ['#002244', '#69BE28'], 'nfl:TB': ['#D50A0A', W],
      'nfl:TEN': ['#0C2340', '#4B92DB'], 'nfl:WAS': ['#5A1414', '#FFB612'],
      'mlb:CLE': ['#00385D', W], 'mlb:TB': ['#092C5C', '#8FBCE6'], 'mlb:MIL': ['#12284B', '#FFC52F'], 'mlb:LAD': ['#005A9C', W],
      'nhl:NJ': ['#000000', '#E8344A'], 'nhl:DET': ['#CE1126', W], 'nhl:FLA': ['#C8102E', '#B9975B'], 'nhl:CBJ': ['#002654', W], 'nhl:BUF': ['#003087', '#FFB81C'], 'nhl:MTL': ['#AF1E2D', W],
      'nhl:WSH': ['#041E42', '#C8102E'], 'nhl:CAR': ['#CC0000', W], 'nhl:SEA': ['#001628', '#99D9D9'], 'nhl:PHI': ['#F74902', '#000000'], 'nhl:TB': ['#002868', W], 'nhl:NYR': ['#0038A8', W],
      'nhl:STL': ['#002F87', '#FCB514'], 'nhl:OTT': ['#C52032', W], 'nhl:VAN': ['#00205B', W], 'nhl:NYI': ['#00539B', '#F47D30'], 'nhl:PIT': ['#FCB514', '#000000'], 'nhl:CHI': ['#CF0A2C', W],
      'nhl:MIN': ['#154734', W], 'nhl:WPG': ['#041E42', W], 'nhl:COL': ['#6F263D', W], 'nhl:DAL': ['#006847', W], 'nhl:VGK': ['#B4975A', '#333F42'], 'nhl:NSH': ['#FFB81C', '#041E42'],
      'nhl:TOR': ['#00205B', W], 'nhl:UTA': ['#0B162A', '#6CACE4'], 'nhl:CGY': ['#C8102E', '#F1BE48'], 'nhl:ANA': ['#F47A38', '#000000'], 'nhl:EDM': ['#041E42', '#FF4C00'], 'nhl:LA': ['#041012', '#A2AAAD'],
      'nhl:BOS': ['#041012', '#FFB81C'], 'nhl:SJ': ['#006D75', W],
      'nba:BOS': ['#007A33', W], 'nba:DET': ['#C8102E', W], 'nba:PHI': ['#006BB6', W], 'nba:NYK': ['#006BB6', '#F58426'], 'nba:OKC': ['#007AC1', '#EF3B24'], 'nba:SAS': ['#041012', '#C4CED4'],
      'nba:GSW': ['#1D428A', '#FFC72C'], 'nba:LAL': ['#552583', '#FDB927'], 'nba:MIN': ['#0C2340', '#78BE20'], 'nba:MIA': ['#98002E', W], 'nba:CLE': ['#860038', '#FDBB30'],
      'ncaaf:MSU': ['#18453B', W], 'ncaaf:ILL': ['#E84A27', '#13294B']
    };
    // Followed teams: key = leagueId:abbr. Highlight their games and build the team catalog.
    var lgLabel = {};
    chipsDef.forEach(function (c) { lgLabel[c.id] = c.label; });
    var catalog = [], seen = {};
    data.forEach(function (d) {
      d.groups.forEach(function (G) {
        G.games.forEach(function (g) {
          var hit = false;
          g.raw.forEach(function (r) {
            if (!r[0] || r[0].charAt(0) === '[') return;
            var key = d.id + ':' + r[0];
            if (follows.indexOf(key) >= 0) hit = true;
            if (!seen[key]) { seen[key] = true; catalog.push({ key: key, abbr: r[0], name: r[1], lg: lgLabel[d.id], lgId: d.id }); }
          });
          g.mine = hit;
          // Logo slot: provider logo in production; team-color monogram until then.
          g.raw.forEach(function (r, k) {
            if (!r[0] || !g.rows[k]) return;
            var c = COLORS[d.id + ':' + r[0]];
            var lose = g.win !== -1 && g.win !== k;
            g.rows[k].abbrStyle = 'display: inline-flex; align-items: center; justify-content: center; flex: none; width: 42px; height: 24px; border-radius: 0; font-family: \'IBM Plex Mono\', monospace; font-size: 11.5px; font-weight: 600; background: ' + (c ? c[0] : '#0B2427') + '; color: ' + (c ? c[1] : '#C8F7FC') + '; opacity: ' + (lose ? '0.5' : '1') + ';';
          });
          // Every team name links to its team page; every card links to its game page.
          g.rows.forEach(function (row, k) {
            var ab = g.raw[k] && g.raw[k][0];
            row.href = TEAMPAGE[d.id + ':' + ab] || TEAMTPL;
            row.aria = row.name + (ab ? ' team page' : ' player page');
          });
          g.hrefLabel = 'Game page →';
          g.aria = g.hasHref ? 'Open game page: ' + g.raw.map(function (r) { return r[1]; }).join(' vs ') + ', ' + g.statusRaw : undefined;
          g.cardStyle = 'display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 0; background: ' + (hit ? '#0C2A2E' : '#061416') + '; border: 1px solid ' + (hit ? '#66E6F2' : '#12363B') + ';';
        });
      });
    });
    var summarize = function (t) {
      var last = null, next = null;
      data.forEach(function (d) {
        if (d.id !== t.lgId) return;
        d.groups.forEach(function (G) {
          G.games.forEach(function (g) {
            var idx = g.raw[0][0] === t.abbr ? 0 : (g.raw[1] && g.raw[1][0] === t.abbr ? 1 : -1);
            if (idx < 0) return;
            var opp = g.raw[1 - idx];
            var where = (g.home === idx) ? 'vs ' : 'at ';
            if (g.isFinal && !last) {
              var ts = g.raw[idx][2], os = opp[2];
              last = { text: (ts > os ? 'W ' : (ts < os ? 'L ' : 'T ')) + ts + '–' + os + ' ' + where + opp[0], res: ts > os ? 1 : (ts < os ? -1 : 0) };
            } else if (!g.isFinal && !next) {
              next = g.statusRaw + ' ' + where + opp[0];
            }
          });
        });
      });
      return { last: last, next: next };
    };
    var byKey = {};
    catalog.forEach(function (t) { byKey[t.key] = t; });
    var mine = follows.filter(function (k) { return byKey[k]; }).map(function (k) {
      var t = byKey[k], s = summarize(t);
      return {
        team: t.name, lg: t.lg,
        href: ({ 'nfl:DET': 'Team.dc.html', 'mlb:DET': 'TeamTigers.dc.html', 'nhl:DET': 'TeamRedWings.dc.html', 'nba:DET': 'TeamPistons.dc.html', 'ncaaf:MSU': 'TeamMSUFootball.dc.html', 'ncaab:MSU': 'TeamMSUBasketball.dc.html' })[k] || '#',
        last: s.last ? s.last.text : 'No recent result',
        next: s.next || 'Nothing scheduled this week',
        lastStyle: 'font-weight: 500; color: ' + (!s.last ? '#4FB8C2' : (s.last.res > 0 ? '#4ADE80' : (s.last.res < 0 ? '#FF5F56' : '#66E6F2'))) + ';',
        removeLabel: 'Stop following ' + t.name,
        remove: function () { self.saveFollows(follows.filter(function (x) { return x !== k; })); }
      };
    });
    var ql = q.trim().toLowerCase();
    var results = !ql ? [] : catalog.filter(function (t) {
      return follows.indexOf(t.key) < 0 && (t.name.toLowerCase().indexOf(ql) >= 0 || t.abbr.toLowerCase() === ql || t.lg.toLowerCase() === ql);
    }).slice(0, 8).map(function (t) {
      return { name: t.name, lg: t.lg, add: function () { self.saveFollows(follows.concat([t.key])); self.setState({ q: '' }); } };
    });

    var rank = function (g) { return (g.mine ? 0 : 2) + (g.live ? 0 : 1); };
    var leagues = data.filter(function (d) { return lg === 'all' || d.id === lg; }).map(function (d) {
      var total = 0;
      var groups = d.groups.map(function (G) {
        total += G.games.length;
        var games = G.games;
        if (lg === 'all') {
          games = games.map(function (g, i) { return { g: g, i: i }; })
            .sort(function (a, b) { return (rank(a.g) - rank(b.g)) || (a.i - b.i); })
            .slice(0, CAP).map(function (x) { return x.g; });
        }
        return { label: G.label, games: games };
      });
      if (lg === 'all') groups = groups.slice(0, 2);
      return {
        name: d.name, sub: d.sub, short: d.short, total: total,
        showMore: lg === 'all',
        open: function () { self.setState({ lg: d.id }); },
        groups: groups
      };
    });

    var slateDef = [
      { t: 'Live', e: '14 matches in progress', lg: 'Tennis · ATP Challenger, WTA 125', live: true },
      { t: '11:45 AM', e: 'Lens v Sporting CP · Sabah v Slavia Prague', lg: 'UEFA Champions League' },
      { t: '2:00 PM', e: 'Arsenal v Lille · Atlético v Man United + 5 more', lg: 'UEFA Champions League' },
      { t: '5:00 PM', e: 'NHL slate begins · 15 games through 9:30 PM', lg: 'NHL' },
      { t: '6:00 PM', e: 'Delaware at Middle Tennessee', lg: 'College football' },
      { t: '7:00 PM', e: 'Guardians at Rays · ALCS Game 2', lg: 'MLB · CLE leads 1–0' },
      { t: '7:00 PM', e: 'FIU at Jacksonville State', lg: 'College football' }
    ];
    var slate = slateDef.map(function (s) {
      return { t: s.t, e: s.e, lg: s.lg, timeStyle: 'width: 66px; flex: none; font-family: \'IBM Plex Mono\', monospace; font-size: 12.5px; padding-top: 1px; color: ' + (s.live ? '#FF5F56' : (s.mine ? '#EAFDFF' : '#C8F7FC')) + '; font-weight: ' + (s.live || s.mine ? '600' : '400') + ';' };
    });

    var divData = [
      { id: 'afce', label: 'AFC E', name: 'AFC East', t: [['NE', 'Bills', 4, 1, 'BUF'], ['', 'Patriots', 3, 2, 'NE'], ['', 'Jets', 2, 3, 'NYJ'], ['', 'Dolphins', 0, 5, 'MIA']] },
      { id: 'afcn', label: 'AFC N', name: 'AFC North', t: [['', 'Ravens', 4, 1, 'BAL'], ['', 'Browns', 3, 2, 'CLE'], ['', 'Steelers', 3, 2, 'PIT'], ['', 'Bengals', 3, 2, 'CIN']] },
      { id: 'afcs', label: 'AFC S', name: 'AFC South', t: [['', 'Jaguars', 4, 1, 'JAC'], ['', 'Colts', 2, 3, 'IND'], ['', 'Texans', 1, 4, 'HOU'], ['', 'Titans', 0, 5, 'TEN']] },
      { id: 'afcw', label: 'AFC W', name: 'AFC West', t: [['', 'Chiefs', 4, 0, 'KC'], ['', 'Broncos', 3, 2, 'DEN'], ['', 'Raiders', 3, 2, 'LV'], ['', 'Chargers', 0, 5, 'LAC']] },
      { id: 'nfce', label: 'NFC E', name: 'NFC East', t: [['', 'Giants', 3, 1, 'NYG'], ['', 'Eagles', 2, 3, 'PHI'], ['', 'Cowboys', 2, 3, 'DAL'], ['', 'Commanders', 1, 3, 'WAS']] },
      { id: 'nfcn', label: 'NFC N', name: 'NFC North', t: [['', 'Vikings', 5, 0, 'MIN'], ['', 'Packers', 3, 2, 'GB'], ['', 'Lions', 3, 2, 'DET'], ['', 'Bears', 3, 2, 'CHI']] },
      { id: 'nfcs', label: 'NFC S', name: 'NFC South', t: [['', 'Panthers', 2, 2, 'CAR'], ['', 'Falcons', 2, 3, 'ATL'], ['', 'Buccaneers', 1, 4, 'TB'], ['', 'Saints', 1, 4, 'NO']] },
      { id: 'nfcw', label: 'NFC W', name: 'NFC West', t: [['', '49ers', 5, 0, 'SF'], ['', 'Seahawks', 3, 2, 'SEA'], ['', 'Rams', 2, 3, 'LA'], ['', 'Cardinals', 1, 4, 'ARI']] }
    ];
    var divId = st.div || 'afce';
    var curDiv = divData.filter(function (d) { return d.id === divId; })[0] || divData[0];
    var divs = divData.map(function (d) {
      var on = d.id === curDiv.id;
      return {
        label: d.label, pressed: on ? 'true' : 'false',
        pick: function () { self.setState({ div: d.id }); },
        btnStyle: 'height: 44px; padding: 0 4px; border-radius: 0; cursor: pointer; font-family: \'IBM Plex Mono\', monospace; font-size: 12px; font-weight: 500; border: 1px solid ' + (on ? '#66E6F2' : '#12363B') + '; ' + (on ? 'background: #66E6F2; color: #000000; text-shadow: none;' : 'background: #061416; color: #4FB8C2;')
      };
    });
    var nfcn = curDiv.t.map(function (r) {
      var gp = r[2] + r[3];
      var pct = gp ? (r[2] / gp) : 0;
      var pctStr = pct === 1 ? '1.000' : pct.toFixed(3).replace(/^0/, '');
      var fol = follows.indexOf('nfl:' + r[4]) >= 0;
      return { t: r[1], wl: r[2] + '–' + r[3], pct: pctStr, rowStyle: fol ? 'color: #C8F7FC; background: #0C2A2E;' : 'color: #66E6F2;' };
    });

    return {
      navCls: navCls,
      chips: chips,
      leagues: leagues,
      mine: mine,
      q: q,
      onQ: function (e) { self.setState({ q: e.target.value }); },
      results: results,
      hasResults: results.length > 0,
      noMatch: ql.length > 0 && results.length === 0,
      hasFollows: mine.length > 0,
      noFollows: mine.length === 0,

        { round: 'NLCS', lead: 'Brewers lead Dodgers', wins: '2–0', next: 'Game 3 Wed · 7:00 PM at LAD' }

    };
