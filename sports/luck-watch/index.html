re used."]},{"t":"div","a":{"class":"s-tabs","role":"group","aria-label":"Test period","style":"margin-bottom: 8px"},"c":[{"t":"sc-for","a":{"list":"{{trk.th.tabs}}","as":"m"},"c":[{"t":"button","a":{"type":"button","class":"{{m.cls}}","aria-pressed":"{{m.on}}","onclick":"{{m.pick}}"},"c":["{{m.label}}"]}]}]},{"t":"p","a":{"class":"s-note","style":"margin: 0 0 6px"},"c":["{{trk.th.sub}}"]},{"t":"div","a":{"class":"s-scroll","tabindex":"0"},"c":[{"t":"table","a":{"class":"s-tbl"},"c":[{"t":"thead","a":{},"c":[{"t":"tr","a":{},"c":[{"t":"th","a":{"scope":"col","class":"l"},"c":["Belief"]},{"t":"th","a":{"scope":"col"},"c":["Player games"]},{"t":"th","a":{"scope":"col"},"c":["Projected"]},{"t":"th","a":{"scope":"col"},"c":["Actual"]},{"t":"th","a":{"scope":"col"},"c":["Gap"]},{"t":"th","a":{"scope":"col"},"c":["{{trk.th.ladLabel}}"]},{"t":"th","a":{"scope":"col"},"c":["How sure (z)"]}]}]},{"t":"tbody","a":{},"c":[{"t":"sc-for","a":{"list":"{{trk.th.rows}}","as":"r","hint-placeholder-count":"6"},"c":[{"t":"tr","a":{},"c":[{"t":"th","a":{"scope":"row","class":"l","style":"min-width: 200px; max-width: 340px; white-space: normal"},"c":["{{r.name}}",{"t":"span","a":{"class":"dim","style":"display: block; font-size: var(--fs-sm); font-weight: 400"},"c":["{{r.desc}}"]}]},{"t":"td","a":{},"c":["{{r.n}}"]},{"t":"td","a":{},"c":["{{r.proj}}"]},{"t":"td","a":{},"c":["{{r.act}}"]},{"t":"td","a":{"style":"{{r.st}}"},"c":["{{r.diff}}"]},{"t":"td","a":{},"c":["{{r.l3}}"]},{"t":"td","a":{},"c":["{{r.z}}"]}]}]}]}]}]},{"t":"p","a":{"class":"s-note","style":"margin: 6px 0 0"},"c":["{{trk.th.note}}"]}]}]}]},{"t":"section","a":{"class":"t-panel","aria-label":"Backtest"},"c":[{"t":"div","a":{"class":"t-ph"},"c":[{"t":"h2","a":{},"c":["Backtest (not a track record)"]},{"t":"span","a":{"class":"dim"},"c":["{{trk.btSub}}"]}]},{"t":"div","a":{"class":"t-pb"},"c":[{"t":"p","a":{"class":"s-note hi","style":"margin: 0 0 10px"},"c":["A backtest replays games that were already over and rates each one using only games played before it. It is a fair test of the method but it was run by us after the fact, so it counts for less than the live record above. Rows with fewer than 20 games are hidden because they say nothing."]},{"t":"sc-if","a":{"value":"{{trk.btNone}}","hint-placeholder-val":"{{false}}"},"c":[{"t":"div","a":{"class":"s-empty"},"c":["{{trk.btNoneText}}"]}]},{"t":"div","a":{"class":"s-scroll","tabindex":"0"},"c":[{"t":"table","a":{"class":"s-tbl"},"c":[{"t":"thead","a":{},"c":[{"t":"tr","a":{},"c":[{"t":"th","a":{"scope":"col","class":"l"},"c":["League"]},{"t":"th","a":{"scope":"col"},"c":["Games"]},{"t":"th","a":{"scope":"col"},"c":["Picked right"]},{"t":"th","a":{"scope":"col"},"c":["Brier"]},{"t":"th","a":{"scope":"col"},"c":["Always-home Brier"]},{"t":"th","a":{"scope":"col"},"c":["Avg. miss"]},{"t":"th","a":{"scope":"col"},"c":["Bias"]},{"t":"th","a":{"scope":"col"},"c":["Span"]}]}]},{"t":"tbody","a":{},"c":[{"t":"sc-for","a":{"list":"{{trk.bt}}","as":"r","hint-placeholder-count":"4"},"c":[{"t":"tr","a":{},"c":[{"t":"th","a":{"scope":"row","class":"l"},"c":["{{r.lg}}"]},{"t":"td","a":{},"c":["{{r.n}}"]},{"t":"td","a":{},"c":["{{r.acc}}"]},{"t":"td","a":{},"c":["{{r.brier}}"]},{"t":"td","a":{},"c":["{{r.home}}"]},{"t":"td","a":{},"c":["{{r.mae}}"]},{"t":"td","a":{},"c":["{{r.bias}}"]},{"t":"td","a":{},"c":["{{r.span}}"]}]}]}]}]}]},{"t":"p","a":{"class":"s-note","style":"margin: 10px 0 0"},"c":["Brier score: average squared error of the win probability, lower is better. A coin flip scores .250; always guessing the season\u2019s home-win rate is the fairer bar. Avg. miss and bias are in the league\u2019s scoring unit (bias above zero means home teams beat the projection on average). MLB is not logged or backtested: its ratings come from season totals, so there is no game history to replay."]}]}]}]},{"t":"sc-if","a":{"value":"{{isMeth}}","hint-placeholder-val":"{{false}}"},"c":[{"t":"section","a":{"class":"t-panel","aria-label":"The model"},"c":[{"t":"div","a":{"class":"t-ph"},"c":[{"t":"h2","a":{},"c":["The house model"]},{"t":"span","a":{"class":"dim"},"c":["Applies to every league"]}]},{"t":"div","a":{"class":"t-pb s-note hi","style":"font-size: var(--fs-md)"},"c":[{"t":"p","a":{"style":"margin: 0"},"c":["Each team gets one number: how many points (goals, runs) better or worse than an average team it would be on a neutral field. It is solved from every completed game this season at once, so beating good teams counts more than beating bad ones, and the home team\u2019s built-in edge is taken out first."]},{"t":"p","a":{},"c":["Early in a season a few games say little, so every rating is pulled toward a starting point as if the team had already played ",{"t":"i","a":{},"c":["k"]}," games at that level. The starting point is a share of the team\u2019s rating from last season wherever replaying past seasons showed that last year carries information, otherwise the league average. That is the same idea as \u201cSRS \u00d7 games \u00f7 (games + k)\u201d. Where it tested better, recent games count more than old ones (a half-life in weeks), blowouts are damped, and teams outside the division the site covers (FCS, non-D-I) share one pooled rating. All-star and international exhibition games are left out, and a relocated team keeps its history (Arizona \u2192 Utah)."]},{"t":"p","a":{},"c":["Ratings come from margins, so they carry a team\u2019s usual quarterback but cannot see a change. For NFL games the projection is moved by the starting quarterback\u2019s recent play (EPA per dropback, recent seasons weighted more, shrunk toward replacement level) against the team\u2019s usual starter, using free nflverse data. NFL ratings also count each game\u2019s result 60% on team efficiency (expected points added per play, from nflverse) and 40% on the final margin, which tested better than margins alone. Fitted on 12 seasons, the quarterback adjustment improved held-out log loss in every one of the last seven test seasons. Betting markets know more still, so the pipeline records the market\u2019s number for every game it forecasts but never uses it: forecasts, ratings and season odds come from scores and this quarterback signal only. After the games finish, the track record compares the house forecast with the market\u2019s, and the gaps show what information is still missing. The market numbers themselves are never published on this site."]},{"t":"p","a":{},"c":["NBA projections also count who is playing. Every player gets a value in points of margin, learned only from earlier games\u2019 ESPN box scores: his expected minutes times a blend of his box-score production per minute (game score: points, shooting, rebounds, assists, steals, blocks, turnovers) and his shrunk on/off plus-minus. A finished game\u2019s result is adjusted for the rotation players who sat it, so a loss without a star does not drag the team\u2019s rating as if it were at full strength, and an upcoming game is moved by the value of players on ESPN\u2019s injury report (Out counts fully, Doubtful mostly, Questionable and Day-To-Day partly). Tested on four held-out seasons, this lowered NBA log loss by about 1.6% in every test season and closed about a quarter of the gap to closing lines."]},{"t":"p","a":{},"c":["NFL projections count the other 21 positions the same way: a team\u2019s regulars are the players who took at least 60% of its offensive or defensive snaps over its last three games (nflverse snap counts). Results are adjusted for regulars who sat, and upcoming games are moved by regulars on ESPN\u2019s injury report, about one point per missing every-down starter. It improved held-out log loss in nine of the last ten test seasons, a smaller and noisier gain than the quarterback signal."]},{"t":"p","a":{},"c":["College football projections count starting quarterbacks: each passer is rated on adjusted yards per dropback from ESPN box scores (touchdowns, interceptions and sacks counted), shrunk toward a below-average level when his record is short. Results are adjusted for who actually started; upcoming games use each team\u2019s latest starter, because there is no free college injury feed. Scored the same way on three held-out seasons, it improved log loss in each, by a small margin."]},{"t":"p","a":{},"c":["College basketball preseason ratings account for roster turnover. Each player\u2019s value last season is his box-score production (game score above a replacement level) per team game. A team\u2019s starting rating moves by 0.3 times the value of its current roster, wherever those players were last season, minus the value its own players produced. That way returning stars, departures and transfers all count. Rosters come from ESPN until a team has played three games, then from its box scores. On two held-out seasons it improved log loss in both, mostly in November and December."]},{"t":"p","a":{},"c":["College football preseason ratings use returning production, the idea behind ESPN\u2019s SP+. Each player\u2019s share of his team\u2019s passing, rushing and receiving, and defensive production last season is credited to his current team, so departures and transfers both count. Skill-position production carries the most weight. It improved held-out log loss in each of three test seasons. Both college leagues and college hockey also blend in program history: ratings from two and three seasons back pull last season\u2019s rating a little toward them, as KenPom and SP+ do."]},{"t":"p","a":{},"c":["In the NHL and both college leagues, each win probability is also blended with a FiveThirtyEight-style Elo rating (20% in college, 30% in the NHL). Elo moves after every game by a margin-of-victory multiplier and regresses toward average between seasons. It reacts to recent results differently from the main ratings, so the two make different mistakes, and the blend scored better on held-out seasons. The blend did not clear the bar in the NFL or NBA, so those leagues don\u2019t use it."]},{"t":"p","a":{},"c":["Two further steps passed the same held-out tests. NBA projections are blended with lineup strength, the summed pre-game value of the players expected to play (injury-report players counted by how likely they are to sit); it lowered held-out log loss in each of four test seasons. College basketball margins are stretched by a factor fitted on earlier seasons, because ratings pulled toward a starting point came out compressed (actual margins ran about 1.2 times the projected ones); it cut the held-out margin miss in every test season and leaves win chances essentially unchanged. NBA, NHL, college basketball and college football game pages also show a projected total from offense and defense ratings; checked on the newest complete season they miss by a little more than the closing total, so treat them as context."]},{"t":"p","a":{},"c":["NFL game pages add player stat projections and a projected total. A player projection is volume times efficiency: a receiver\u2019s share of his team\u2019s targets times the team\u2019s pass attempts times his yards per target (catch rate for receptions), a runner\u2019s share of carries times team carries times yards per carry, and a quarterback\u2019s share of attempts times yards per attempt. Shares and rates weight recent games most, are pulled toward position averages, and are adjusted for how many yards the opponent allows. The median and middle 50% are not guesses: they are the projection times how players with projections of that size actually finished in earlier seasons, so a sportsbook line can be turned into a measured over/under rate. Game totals come from separate offense and defense point ratings plus wind. Tested on past seasons, prop medians miss by about 23 receiving yards, 1.7 catches, 26 rushing yards and 63 passing yards, and totals miss by about 10.7 points against 10.4 for the closing line; picking overs and unders against the line from these numbers has been break-even, so treat them as a second opinion. Game pages also show each player\u2019s ceiling (the 90th percentile) and the chance of reaching a few round numbers. The Track record page scores the whole range, not just the middle: it counts how often results finished above the stated 75th, 90th and 95th and in each tenth of the range, and lists how the picks did against closing prices by size of gap, overs versus unders, each stat and the latest 50 and 200. We also tested giving each player his own range (from his past games, from his yards per target, and from a simulation of volume times efficiency). Each scored worse on held-out seasons than one shared range per projection size, so the shared ranges stay. NHL game pages show each skater\u2019s expected shots on goal and the chance of 1+ through 5+ shots: shots per minute times expected ice time, adjusted for the opponent, with the chances read from how often players with projections that size really finished with each count over the last three seasons. On held-out seasons that beat a plain minutes-only baseline and matched the actual 1+ to 5+ rates within about a point. Two more NHL projections use the same method. ",{"t":"b","a":{},"c":["Anytime goal:"]}," expected shots times a shooting percentage (pulled toward the league rate until a player has taken many shots), with the chance read from how often players in each projection band really scored; on the 2025 and 2026 seasons it scored a Brier of .119 and .121 against .128 and .130 for giving every player the league rate. ",{"t":"b","a":{},"c":["Goalie saves:"]}," shots faced come from the opponent\u2019s shots per game and the goalie\u2019s team\u2019s shots allowed, times his save percentage (pulled toward average); chances of 20+, 25+, 30+ and 35+ saves are read from past finishes, and the ranked probability score was 3.64 and 3.60 against 3.91 and 3.85 for a league-average baseline. Team pages for NHL clubs also show a shot and goal trend (this season and the last 15, 10 and 5 games, with league ranks), which is a description of recent play and is not fed into the projections. Tables on game pages can be downloaded as CSV. NHL shot tables also show the most likely exact count, a steady-or-streaky label for how wide each player\u2019s range is, flags for a recent absence, a new team or a small sample, an at-least or exactly view, and the shots-per-60 and opponent inputs behind each projection. The Track record page adds a seven-day report and a yesterday board that places each result inside its projected range, and the team trend table now includes the last 30 games and last season with changes against this season. The NHL record also scores the same projections with a plain Poisson count shape for comparison, checks projection accuracy by size, and runs a theory lab that tests common beliefs (back-to-backs, hot and cold streaks, a shot-less game, the road) against the projections, on two held-out seasons and forward from the day tracking began. On game pages you can mark a skater out as a what-if: his ice time is shared by teammates at his position and their chances are repriced. Calibration tables show the normal 95% range for each row, so a real miss stands out from bad luck. NBA game pages project threes made for every rotation player: projected minutes (scaled so the players expected to dress add up to 240) times his three-point attempts per minute, how many threes the opponent allows, and his make rate, with the chance of each count read from how similar projections finished in past seasons. On the two held-out seasons it scored a range score of .591 and .586 against .595 and .588 for a Poisson count and .78 and .76 for a league-wide baseline; its settings were picked by comparing a few options on those same seasons, so the live record is the clean test. The Injuries page now tracks how often players listed as questionable, doubtful or day-to-day actually play, forward from November 20, 2026. The Methodology page has a price calculator that removes the book\u2019s cut and shows break-even and expected return."]},{"t":"p","a":{},"c":["The settings that are not obvious are not guessed. The pipeline stores 10 to 12 past regular seasons per league (NFL back to 1999), replays them week by week, projecting each week using only earlier games, and keeps the settings with the lowest log loss. The check is rolling: for each of the four newest seasons the settings are fit only on the seasons before it and scored on that season, which they never saw. They replace the preset values only if they win across those held-out seasons by a clear, statistically tested margin and no held-out season gets clearly worse. Pandemic seasons (2020\u201321) are left out of fitting. The NFL home edge is the exception: game results are too noisy to pin it down, so it comes from the average closing line over the last five seasons (about 1.6 points, the same for division games since 2021). Lines are used only for that and for checking the model; the site never shows them. ",{"t":"a","a":{"href":"History.dc.html"},"c":["Model history"]}," shows what each ingredient was worth, season by season."]},{"t":"p","a":{},"c":["Three extra inputs are used only in the leagues where the same held-out test showed they help. ",{"t":"b","a":{},"c":["Rest:"]}," each extra day of rest one team has over the other (capped at a few days) is worth a fitted amount, taken out of past results and added to projections; it tested useful in the NFL, NBA, NHL and college football and basketball. ",{"t":"b","a":{},"c":["MLB starting pitchers:"]}," each announced starter gets a rating from the parts of run prevention a pitcher controls (strikeouts, walks, hit batters and home runs per inning), from this season and last, pulled toward average until he has pitched enough innings; the gap between the two starters, scaled to the share of the game a starter usually pitches, is added to the projection. ",{"t":"b","a":{},"c":["NHL expected goals:"]}," goals are noisy, so each past game\u2019s rating input mixes the real goal margin with the expected-goals margin (the quality of the chances each team created); this made held-out NHL predictions better in all four test seasons."]},{"t":"p","a":{},"c":["A game projection is the rating gap plus the home edge, plus any rest and starting-pitcher edge. The win probability treats the final margin as normally distributed around that projection: P(home wins) = \u03a6((home \u2212 away + home edge) \u00f7 s). In leagues where it tested better, s is the league\u2019s \u03c3 widened by how unsure both ratings still are, so early-season and thin-schedule games get less confident probabilities; elsewhere s = \u03c3."]},{"t":"p","a":{},"c":["Season odds replay the rest of the season 10,000 times. Each simulation draws every team\u2019s true strength from its rating and uncertainty, lets NFL strengths drift a little week to week (injuries, form), plays the remaining games, seeds the playoff bracket and plays it out. Replaying 2003\u20132025 NFL seasons from weeks 4, 8 and 12, teams given 90% or more made the playoffs about 93\u201396% of the time and teams given 10% or less about 1\u20135%. NFL tiebreakers are simplified to division record, then point margin. The NHL simulation plays each team\u2019s remaining games against a league-average opponent instead of the real schedule."]},{"t":"p","a":{},"c":["The Track record page logs the model\u2019s pick for every NFL, college football, NHL, NBA and college basketball and hockey game before it starts, freezes it at kickoff and grades it after the final. It begins empty at launch and is not back-filled. The backtest beside it replays past games using only earlier results; it is labelled separately because we ran it after the fact. MLB is not logged. ",{"t":"a","a":{"href":"History.dc.html"},"c":["Model history"]}," replays how the model improved over past seasons."]},{"t":"p","a":{"style":"margin-bottom: 0"},"c":["What it leaves out: injuries outside the NBA, weather, lineup news other than MLB starters, NFL and NBA availability, and anything else a betting market knows. The gains from the extra inputs are real but small (each lowers held-out log loss by roughly 0.1\u20130.3%). Treat it as a well-calibrated baseline, not a forecast to bet on."]}]}]},{"t":"section","a":{"class":"t-panel","aria-label":"Price calculator"},"c":[{"t":"div","a":{"class":"t-ph"},"c":[{"t":"h2","a":{},"c":["Price calculator"]},{"t":"span","a":{"class":"dim"},"c":["Runs in your browser"]}]},{"t":"div","a":{"class":"t-pb"},"c":[{"t":"p","a":{"class":"s-note hi","style":"margin: 0 0 10px"},"c":["Turns two American prices into the market\u2019s real chance (the book\u2019s cut removed), the break-even rate, and the return you would expect at a chance you choose. Nothing is stored or sent."]},{"t":"div","a":{"class":"s-grid"},"c":[{"t":"label","a":{},"c":[{"t":"span","a":{"class":"t-th"},"c":["Price, side A (e.g. -115)"]},{"t":"input","a":{"class":"s-input","type":"number","step":"1","inputmode":"numeric","value":"{{calc.a}}","onchange":"{{calc.onA}}"},"c":[]}]},{"t":"label","a":{},"c":[{"t":"span","a":{"class":"t-th"},"c":["Price, side B (e.g. -105)"]},{"t":"input","a":{"class":"s-input","type":"number","step":"1","inputmode":"numeric","value":"{{calc.b}}","onchange":"{{calc.onB}}"},"c":[]}]},{"t":"label","a":{},"c":[{"t":"span","a":{"class":"t-th"},"c":["Your chance for side A (%)"]},{"t":"input","a":{"class":"s-input","type":"number","step":"0.5","inputmode":"decimal","value":"{{calc.m}}","onchange":"{{calc.onM}}"},"c":[]}]},{"t":"label","a":{},"c":[{"t":"span","a":{"class":"t-th"},"c":["Price you got on A (optional)"]},{"t":"input","a":{"class":"s-input","type":"number","step":"1","inputmode":"numeric","value":"{{calc.g}}","onchange":"{{calc.onG}}"},"c":[]}]}]},{"t":"div","a":{"class":"s-grid","style":"margin-top: 10px"},"c":[{"t":"sc-for","a":{"list":"{{calc.out}}","as":"c","hint-placeholder-count":"4"},"c":[{"t":"div","a":{"class":"s-stat"},"c":[{"t":"div","a":{"class":"k"},"c":["{{c.k}}"]},{"t":"div","a":{"class":"v"},"c":["{{c.v}}"]},{"t":"div","a":{"class":"s"},"c":["{{c.s}}"]}]}]}]},{"t":"h3","a":{"style":"margin: 16px 0 6px; font-size: var(--fs-md)"},"c":["Converter: prediction-market price or percent to American odds"]},{"t":"div","a":{"class":"s-grid"},"c":[{"t":"label","a":{},"c":[{"t":"span","a":{"class":"t-th"},"c":["Price in cents or percent (e.g. 62)"]},{"t":"input","a":{"class":"s-input","type":"number","step":"0.5","inputmode":"decimal","value":"{{calc.c}}","onchange":"{{calc.onC}}"},"c":[]}]},{"t":"label","a":{},"c":[{"t":"span","a":{"class":"t-th"},"c":["American odds (e.g. -150 or +130)"]},{"t":"input","a":{"class":"s-input","type":"number","step":"1","inputmode":"numeric","value":"{{calc.d}}","onchange":"{{calc.onD}}"},"c":[]}]}]},{"t":"div","a":{"class":"s-grid","style":"margin-top: 10px"},"c":[{"t":"sc-for","a":{"list":"{{calc.conv}}","as":"c","hint-placeholder-count":"2"},"c":[{"t":"div","a":{"class":"s-stat"},"c":[{"t":"div","a":{"class":"k"},"c":["{{c.k}}"]},{"t":"div","a":{"class":"v"},"c":["{{c.v}}"]},{"t":"div","a":{"class":"s"},"c":["{{c.s}}"]}]}]}]},{"t":"h3","a":{"style":"margin: 16px 0 6px; font-size: var(--fs-md)"},"c":["Pick\u2019em break-even: the hit rate each pick needs"]},{"t":"div","a":{"class":"s-grid"},"c":[{"t":"label","a":{},"c":[{"t":"span","a":{"class":"t-th"},"c":["Picks in the entry (2 to 8)"]},{"t":"input","a":{"class":"s-input","type":"number","step":"1","inputmode":"numeric","value":"{{calc.pn}}","onchange":"{{calc.onPn}}"},"c":[]}]},{"t":"label","a":{},"c":[{"t":"span","a":{"class":"t-th"},"c":["Payout multiple if all hit (e.g. 10)"]},{"t":"input","a":{"class":"s-input","type":"number","step":"0.1","inputmode":"decimal","value":"{{calc.p0}}","onchange":"{{calc.onP0}}"},"c":[]}]},{"t":"label","a":{},"c":[{"t":"span","a":{"class":"t-th"},"c":["Multiple with one miss (0 if none)"]},{"t":"input","a":{"class":"s-input","type":"number","step":"0.1","inputmode":"decimal","value":"{{calc.p1}}","onchange":"{{calc.onP1}}"},"c":[]}]},{"t":"label","a":{},"c":[{"t":"span","a":{"class":"t-th"},"c":["Multiple with two misses (0 if none)"]},{"t":"input","a":{"class":"s-input","type":"number","step":"0.1","inputmode":"decimal","value":"{{calc.p2}}","onchange":"{{calc.onP2}}"},"c":[]}]}]},{"t":"div","a":{"class":"s-grid","style":"margin-top: 10px"},"c":[{"t":"sc-for","a":{"list":"{{calc.pk}}","as":"c","hint-placeholder-count":"2"},"c":[{"t":"div","a":{"class":"s-stat"},"c":[{"t":"div","a":{"class":"k"},"c":["{{c.k}}"]},{"t":"div","a":{"class":"v"},"c":["{{c.v}}"]},{"t":"div","a":{"class":"s"},"c":["{{c.s}}"]}]}]}]},{"t":"p","a":{"class":"s-note","style":"margin: 10px 0 0"},"c":["Break-even is the hit rate per pick at which the entry returns exactly what you put in, assuming every pick has the same chance and they are independent. Payout multiples differ by app and change, so enter the ones on your slip. Your own projection for each pick, from the game pages, is what to compare it with; this is arithmetic, not a recommendation."]},{"t":"p","a":{"class":"s-note","style":"margin: 10px 0 0"},"c":["The book\u2019s cut is the amount the two implied chances add up past 100%. The no-vig chance splits it in proportion. Expected return per unit staked at side A is your chance times the payout minus the chance you lose. If you enter the price you got and the closing price for A, the last card shows whether you beat the close: the best single check of whether a pick had real value, whatever the result."]}]}]},{"t":"section","a":{"class":"t-panel","aria-label":"Glossary"},"c":[{"t":"div","a":{"class":"t-ph"},"c":[{"t":"h2","a":{},"c":["Glossary"]},{"t":"span","a":{"class":"dim"},"c":["Terms used across the sports pages"]}]},{"t":"div","a":{"class":"t-pb"},"c":[{"t":"div","a":{"class":"s-tabs","role":"group","aria-label":"Topic","style":"margin-bottom: 8px"},"c":[{"t":"sc-for","a":{"list":"{{gl.tabs}}","as":"m"},"c":[{"t":"button","a":{"type":"button","class":"{{m.cls}}","aria-pressed":"{{m.on}}","onclick":"{{m.pick}}"},"c":["{{m.label}}"]}]}]},{"t":"dl","a":{"style":"margin: 0"},"c":[{"t":"sc-for","a":{"list":"{{gl.items}}","as":"g"},"c":[{"t":"dt","a":{"style":"color: var(--wh); font-weight: 600; margin-top: 10px"},"c":["{{g.t}}"]},{"t":"dd","a":{"style":"margin: 2px 0 0; color: var(--dim)"},"c":["{{g.d}}"]}]}]}]}]},{"t":"section","a":{"class":"t-panel","aria-label":"League settings"},"c":[{"t":"div","a":{"class":"t-ph"},"c":[{"t":"h2","a":{},"c":["League settings and live status"]},{"t":"span","a":{"class":"dim"},"c":["Read from the current model files"]}]},{"t":"div","a":{"class":"t-pb"},"c":[{"t":"div","a":{"class":"s-scroll","tabindex":"0"},"c":[{"t":"table","a":{"class":"s-tbl"},"c":[{"t":"thead","a":{},"c":[{"t":"tr","a":{},"c":[{"t":"th","a":{"scope":"col"},"c":["League"]},{"t":"th","a":{"scope":"col"},"c":["Home edge"]},{"t":"th","a":{"scope":"col"},"c":["\u03c3"]},{"t":"th","a":{"scope":"col"},"c":["k (games)"]},{"t":"th","a":{"scope":"col"},"c":["Games used"]},{"t":"th","a":{"scope":"col","class":"l"},"c":["Starts from"]},{"t":"th","a":{"scope":"col","class":"l"},"c":["Settings"]},{"t":"th","a":{"scope":"col","class":"l"},"c":["Results source"]}]}]},{"t":"tbody","a":{},"c":[{"t":"sc-for","a":{"list":"{{meth.rows}}","as":"r","hint-placeholder-count":"7"},"c":[{"t":"tr","a":{},"c":[{"t":"th","a":{"scope":"row","class":"l"},"c":["{{r.lg}}"]},{"t":"td","a":{},"c":["{{r.hfa}}"]},{"t":"td","a":{},"c":["{{r.sigma}}"]},{"t":"td","a":{},"c":["{{r.k}}"]},{"t":"td","a":{},"c":["{{r.games}}"]},{"t":"td","a":{"class":"l dim"},"c":["{{r.start}}"]},{"t":"td","a":{"class":"l dim"},"c":["{{r.fit}}"]},{"t":"td","a":{"class":"l dim"},"c":["{{r.src}}"]}]}]}]}]}]},{"t":"p","a":{"class":"s-note","style":"margin: 10px 0 0"},"c":["\u201cFit on past seasons\u201d means the settings were chosen by replaying past seasons and beat the preset ones on seasons held out of the fit; \u201cpreset\u201d means they are set by hand from the same replays (the NHL preset, for example, was raised to about 30 games of weight in October 2026 after the replays showed early-season NHL ratings were far too jumpy). MLB switched from season run margin to the same game-by-game method in October 2026, once twelve stored seasons showed it projects games better. Data files last updated {{meth.updated}}."]}]}]},{"t":"section","a":{"class":"t-panel","aria-label":"Sources"},"c":[{"t":"div","a":{"class":"t-ph"},"c":[{"t":"h2","a":{},"c":["Data sources"]}]},{"t":"div","a":{"class":"t-pb s-note"},"c":[{"t":"p","a":{"style":"margin: 0"},"c":["Scores, schedules, box scores, standings, team lists, injury reports and stat leaders come from ESPN\u2019s public site API. NFL seasons 1999\u20132013 and NFL closing lines come from nflverse (CC-BY 4.0). MLB probable starters and pitching lines come from the MLB Stats API (\u00a9 MLB Advanced Media, used for non-commercial purposes). NHL expected goals are from ",{"t":"a","a":{"href":"https://moneypuck.com"},"c":["MoneyPuck.com"]},". Live pages read it through this site\u2019s own cache (about 30 seconds for scores); standings, injuries and ratings are rebuilt hourly by a scheduled job, and team lists and leaders daily. College football results switch to CollegeFootballData automatically when an API key is configured."]},{"t":"p","a":{"style":"margin-bottom: 0"},"c":["Not shown or used in projections: betting lines (NFL closing lines only set the home edge and check the model), ESPN\u2019s own win probabilities and predictions, and ESPN\u2019s written recaps or injury notes."]}]}]}]}]},{"t":"footer","a":{"class":"t-foot"},"c":[{"t":"div","a":{"style":"max-width: 1280px; margin: 0 auto; padding: 16px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size:var(--fs)","class":"dim"},"c":[{"t":"span","a":{},"c":["Data: ESPN public API \u00b7 Ratings, projections and odds: house model \u00b7 All times {{tzLabel}}"]},{"t":"span","a":{},"c":["Built by Nathan Skown"]}]}]},{"t":"div","a":{"class":"t-crt","aria-hidden":"true"},"c":[]}]}];</script>

<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { models: {}, injuries: {}, iq: '', pm: 'rec_yds', pq: '', lines: {} }; }
  componentDidMount() {
    var self = this, key = this.props.tool;
    var ok = key === 'TrackRecord' ? ['all', 'nfl', 'ncaaf', 'nhl', 'nba', 'ncaab', 'ncaah'] : key === 'Odds' ? ['nfl', 'nhl'] : key === 'Injuries' ? ['nfl', 'mlb', 'nhl', 'nba'] : ['nfl', 'mlb', 'nhl', 'nba', 'ncaaf', 'ncaab', 'ncaah'];
    var lg = String(this.state.lg || (key === 'TrackRecord' ? 'all' : 'nfl')).toLowerCase();
    if (ok.indexOf(lg) < 0) lg = key === 'TrackRecord' ? 'all' : 'nfl';
    this.setState({ lg: lg });
    SD.data('teams.json').then(function (x) { self.setState({ index: x }); }, function () {});
    SD.data('status.json').then(function (x) { self.setState({ status: x }); }, function () {});
    if (key === 'TrackRecord') {
      SD.data('track/summary.json').then(function (x) { self.setState({ track: x }); }, function () { self.setState({ track: { err: true } }); });
      SD.data('track/backtest.json').then(function (x) { self.setState({ back: x }); }, function () { self.setState({ back: { err: true } }); });
      SD.data('props/nfl.json').then(function (x) { self.setState({ props: x }); }, function () {});
      SD.data('props/nhl.json').then(function (x) { self.setState({ nprops: x }); }, function () {});
      SD.data('props/nba.json').then(function (x) { self.setState({ bprops: x }); }, function () {});
    } else if (key === 'Methodology') ['nfl', 'mlb', 'nhl', 'nba', 'ncaaf', 'ncaab', 'ncaah'].forEach(function (k) { self.loadModel(k); });
    else this.loadLeague(lg);
  }
  loadStandings(lg) {
    var self = this, o = this.state.stand || {};
    if (o[lg]) return;
    SD.data('standings/' + lg + '.json').then(function (d) { var n = Object.assign({}, self.state.stand); n[lg] = d; self.setState({ stand: n }); }, function () { var n = Object.assign({}, self.state.stand); n[lg] = { err: true }; self.setState({ stand: n }); });
  }
  loadModel(lg) {
    var self = this;
    if (this.state.models[lg]) return;
    SD.data('model/' + lg + '.json').then(function (m) { var o = Object.assign({}, self.state.models); o[lg] = m; self.setState({ models: o }); }, function () { var o = Object.assign({}, self.state.models); o[lg] = { err: true }; self.setState({ models: o }); });
  }
  loadLeague(lg) {
    var self = this, key = this.props.tool;
    if (key === 'TrackRecord') return;
    if (key === 'Injuries') {
      if (!this.state.avail) SD.data('track/avail.json').then(function (m) { self.setState({ avail: m }); }, function () {});
      if (!this.state.injuries[lg]) SD.data('injuries/' + lg + '.json').then(function (m) { var o = Object.assign({}, self.state.injuries); o[lg] = m; self.setState({ injuries: o }); }, function () {});
    } else { this.loadModel(lg); if (key === 'LuckWatch') this.loadStandings(lg); }
  }
  renderVals() {
    var TOOLS = {
      Simulator: ['SIM', 'Matchup simulator', 'Pick any two teams in a league to see the house model’s projected margin and win probability.'],
      Odds: ['ODDS', 'Playoff odds', 'Every team’s chances to make the playoffs, win its division and win it all, from 10,000 simulations of the rest of the season. Rebuilt every hour.'],
      Injuries: ['INJ', 'Injuries', 'League-wide injury reports for the four pro leagues, refreshed hourly.'],
      LuckWatch: ['LUCK', 'Luck watch', 'Teams whose record has outrun, or lagged, what their scoring margin says they should have won.'],
      Schedule: ['SOS', 'Schedule strength', 'How good the opponents each team has faced were, and, where the full schedule is published, how good the ones still to come are.'],
      TrackRecord: ['TRAK', 'Track record', 'Every house-model pick, saved before the game starts and graded after the final. The record begins empty at launch and fills one game at a time; nothing is back-filled.'],
      Methodology: ['METH', 'Methodology', 'How every rating, projection and probability in the Sports section is built, and where the data comes from.']
    };
    var S = this.state, self = this, key = TOOLS[this.props.tool] ? this.props.tool : 'Simulator', lg = S.lg || 'nfl';
    var fk = {}; Object.keys(TOOLS).forEach(function (k) { fk[k] = 't-fkey' + (k === key ? ' is-on' : ''); });
    var idx = {}; (((S.index || {}).leagues || {})[lg] || []).forEach(function (t) { idx[t.id] = t; });
    var live = { Simulator: 1, Odds: 1, Injuries: 1, TrackRecord: 1, Methodology: 1, LuckWatch: 1, Schedule: 1 };
