]},{"t":"th","a":{"scope":"col"},"c":["Games"]},{"t":"th","a":{"scope":"col"},"c":["Picked right"]},{"t":"th","a":{"scope":"col"},"c":["Brier"]},{"t":"th","a":{"scope":"col"},"c":["Always-home Brier"]},{"t":"th","a":{"scope":"col"},"c":["Avg. miss"]},{"t":"th","a":{"scope":"col"},"c":["Bias"]},{"t":"th","a":{"scope":"col"},"c":["Span"]}]}]},{"t":"tbody","a":{},"c":[{"t":"sc-for","a":{"list":"{{trk.bt}}","as":"r","hint-placeholder-count":"4"},"c":[{"t":"tr","a":{},"c":[{"t":"th","a":{"scope":"row","class":"l"},"c":["{{r.lg}}"]},{"t":"td","a":{},"c":["{{r.n}}"]},{"t":"td","a":{},"c":["{{r.acc}}"]},{"t":"td","a":{},"c":["{{r.brier}}"]},{"t":"td","a":{},"c":["{{r.home}}"]},{"t":"td","a":{},"c":["{{r.mae}}"]},{"t":"td","a":{},"c":["{{r.bias}}"]},{"t":"td","a":{},"c":["{{r.span}}"]}]}]}]}]}]},{"t":"p","a":{"class":"s-note","style":"margin: 10px 0 0"},"c":["Brier score: average squared error of the win probability, lower is better. A coin flip scores .250; always guessing the season\u2019s home-win rate is the fairer bar. Avg. miss and bias are in the league\u2019s scoring unit (bias above zero means home teams beat the projection on average). MLB is not logged or backtested: its ratings come from season totals, so there is no game history to replay."]}]}]}]},{"t":"sc-if","a":{"value":"{{isMeth}}","hint-placeholder-val":"{{false}}"},"c":[{"t":"section","a":{"class":"t-panel","aria-label":"The model"},"c":[{"t":"div","a":{"class":"t-ph"},"c":[{"t":"h2","a":{},"c":["The house model"]},{"t":"span","a":{"class":"dim"},"c":["Applies to every league"]}]},{"t":"div","a":{"class":"t-pb s-note hi","style":"font-size: 14px"},"c":[{"t":"p","a":{"style":"margin: 0"},"c":["Each team gets one number: how many points (goals, runs) better or worse than an average team it would be on a neutral field. It is solved from every completed game this season at once, so beating good teams counts more than beating bad ones, and the home team\u2019s built-in edge is taken out first."]},{"t":"p","a":{},"c":["Early in a season a few games say little, so every rating is pulled toward a starting point as if the team had already played ",{"t":"i","a":{},"c":["k"]}," games at that level. The starting point is a share of the team\u2019s rating from last season wherever replaying past seasons showed that last year carries information, otherwise the league average. That is the same idea as \u201cSRS \u00d7 games \u00f7 (games + k)\u201d. Where it tested better, recent games count more than old ones (a half-life in weeks), blowouts are damped, and teams outside the division the site covers (FCS, non-D-I) share one pooled rating. All-star and international exhibition games are left out, and a relocated team keeps its history (Arizona \u2192 Utah)."]},{"t":"p","a":{},"c":["Ratings come from margins, so they carry a team\u2019s usual quarterback but cannot see a change. For NFL games the projection is moved by the starting quarterback\u2019s recent play (EPA per dropback, recent seasons weighted more, shrunk toward replacement level) against the team\u2019s usual starter, using free nflverse data. NFL ratings also count each game\u2019s result 60% on team efficiency (expected points added per play, from nflverse) and 40% on the final margin, which tested better than margins alone. Fitted on 12 seasons, the quarterback adjustment improved held-out log loss in every one of the last seven test seasons. Betting markets know more still, so the pipeline records the market\u2019s number for every game it forecasts but never uses it: forecasts, ratings and season odds come from scores and this quarterback signal only. After the games finish, the track record compares the house forecast with the market\u2019s, and the gaps show what information is still missing. The market numbers themselves are never published on this site."]},{"t":"p","a":{},"c":["NBA projections also count who is playing. Every player gets a value in points of margin, learned only from earlier games\u2019 ESPN box scores: his expected minutes times a blend of his box-score production per minute (game score: points, shooting, rebounds, assists, steals, blocks, turnovers) and his shrunk on/off plus-minus. A finished game\u2019s result is adjusted for the rotation players who sat it, so a loss without a star does not drag the team\u2019s rating as if it were at full strength, and an upcoming game is moved by the value of players on ESPN\u2019s injury report (Out counts fully, Doubtful mostly, Questionable and Day-To-Day partly). Tested on four held-out seasons, this lowered NBA log loss by about 1.6% in every test season and closed about a quarter of the gap to closing lines."]},{"t":"p","a":{},"c":["NFL projections count the other 21 positions the same way: a team\u2019s regulars are the players who took at least 60% of its offensive or defensive snaps over its last three games (nflverse snap counts). Results are adjusted for regulars who sat, and upcoming games are moved by regulars on ESPN\u2019s injury report, about one point per missing every-down starter. It improved held-out log loss in nine of the last ten test seasons, a smaller and noisier gain than the quarterback signal."]},{"t":"p","a":{},"c":["College football projections count starting quarterbacks: each passer is rated on adjusted yards per dropback from ESPN box scores (touchdowns, interceptions and sacks counted), shrunk toward a below-average level when his record is short. Results are adjusted for who actually started; upcoming games use each team\u2019s latest starter, because there is no free college injury feed. Scored the same way on three held-out seasons, it improved log loss in each, by a small margin."]},{"t":"p","a":{},"c":["College basketball preseason ratings account for roster turnover. Each player\u2019s value last season is his box-score production (game score above a replacement level) per team game. A team\u2019s starting rating moves by 0.3 times the value of its current roster, wherever those players were last season, minus the value its own players produced. That way returning stars, departures and transfers all count. Rosters come from ESPN until a team has played three games, then from its box scores. On two held-out seasons it improved log loss in both, mostly in November and December."]},{"t":"p","a":{},"c":["College football preseason ratings use returning production, the idea behind ESPN\u2019s SP+. Each player\u2019s share of his team\u2019s passing, rushing and receiving, and defensive production last season is credited to his current team, so departures and transfers both count. Skill-position production carries the most weight. It improved held-out log loss in each of three test seasons. Both college leagues and college hockey also blend in program history: ratings from two and three seasons back pull last season\u2019s rating a little toward them, as KenPom and SP+ do."]},{"t":"p","a":{},"c":["In the NHL and both college leagues, each win probability is also blended with a FiveThirtyEight-style Elo rating (20% in college, 30% in the NHL). Elo moves after every game by a margin-of-victory multiplier and regresses toward average between seasons. It reacts to recent results differently from the main ratings, so the two make different mistakes, and the blend scored better on held-out seasons. The blend did not clear the bar in the NFL or NBA, so those leagues don\u2019t use it."]},{"t":"p","a":{},"c":["The settings that are not obvious are not guessed. The pipeline stores 10 to 12 past regular seasons per league (NFL back to 1999), replays them week by week, projecting each week using only earlier games, and keeps the settings with the lowest log loss. The check is rolling: for each of the four newest seasons the settings are fit only on the seasons before it and scored on that season, which they never saw. They replace the preset values only if they win across those held-out seasons by a clear, statistically tested margin and no held-out season gets clearly worse. Pandemic seasons (2020\u201321) are left out of fitting. The NFL home edge is the exception: game results are too noisy to pin it down, so it comes from the average closing line over the last five seasons (about 1.6 points, the same for division games since 2021). Lines are used only for that and for checking the model; the site never shows them. ",{"t":"a","a":{"href":"History.dc.html"},"c":["Model history"]}," shows what each ingredient was worth, season by season."]},{"t":"p","a":{},"c":["Three extra inputs are used only in the leagues where the same held-out test showed they help. ",{"t":"b","a":{},"c":["Rest:"]}," each extra day of rest one team has over the other (capped at a few days) is worth a fitted amount, taken out of past results and added to projections; it tested useful in the NFL, NBA, NHL and college football and basketball. ",{"t":"b","a":{},"c":["MLB starting pitchers:"]}," each announced starter gets a rating from the parts of run prevention a pitcher controls (strikeouts, walks, hit batters and home runs per inning), from this season and last, pulled toward average until he has pitched enough innings; the gap between the two starters, scaled to the share of the game a starter usually pitches, is added to the projection. ",{"t":"b","a":{},"c":["NHL expected goals:"]}," goals are noisy, so each past game\u2019s rating input mixes the real goal margin with the expected-goals margin (the quality of the chances each team created); this made held-out NHL predictions better in all four test seasons."]},{"t":"p","a":{},"c":["A game projection is the rating gap plus the home edge, plus any rest and starting-pitcher edge. The win probability treats the final margin as normally distributed around that projection: P(home wins) = \u03a6((home \u2212 away + home edge) \u00f7 s). In leagues where it tested better, s is the league\u2019s \u03c3 widened by how unsure both ratings still are, so early-season and thin-schedule games get less confident probabilities; elsewhere s = \u03c3."]},{"t":"p","a":{},"c":["Season odds replay the rest of the season 10,000 times. Each simulation draws every team\u2019s true strength from its rating and uncertainty, lets NFL strengths drift a little week to week (injuries, form), plays the remaining games, seeds the playoff bracket and plays it out. Replaying 2003\u20132025 NFL seasons from weeks 4, 8 and 12, teams given 90% or more made the playoffs about 93\u201396% of the time and teams given 10% or less about 1\u20135%. NFL tiebreakers are simplified to division record, then point margin. The NHL simulation plays each team\u2019s remaining games against a league-average opponent instead of the real schedule."]},{"t":"p","a":{},"c":["The Track record page logs the model\u2019s pick for every NFL, college football, NHL, NBA and college basketball and hockey game before it starts, freezes it at kickoff and grades it after the final. It begins empty at launch and is not back-filled. The backtest beside it replays past games using only earlier results; it is labelled separately because we ran it after the fact. MLB is not logged. ",{"t":"a","a":{"href":"History.dc.html"},"c":["Model history"]}," replays how the model improved over past seasons."]},{"t":"p","a":{"style":"margin-bottom: 0"},"c":["What it leaves out: injuries outside the NBA, weather, lineup news other than MLB starters, NFL and NBA availability, and anything else a betting market knows. The gains from the extra inputs are real but small (each lowers held-out log loss by roughly 0.1\u20130.3%). Treat it as a well-calibrated baseline, not a forecast to bet on."]}]}]},{"t":"section","a":{"class":"t-panel","aria-label":"League settings"},"c":[{"t":"div","a":{"class":"t-ph"},"c":[{"t":"h2","a":{},"c":["League settings and live status"]},{"t":"span","a":{"class":"dim"},"c":["Read from the current model files"]}]},{"t":"div","a":{"class":"t-pb"},"c":[{"t":"div","a":{"class":"s-scroll","tabindex":"0"},"c":[{"t":"table","a":{"class":"s-tbl"},"c":[{"t":"thead","a":{},"c":[{"t":"tr","a":{},"c":[{"t":"th","a":{"scope":"col"},"c":["League"]},{"t":"th","a":{"scope":"col"},"c":["Home edge"]},{"t":"th","a":{"scope":"col"},"c":["\u03c3"]},{"t":"th","a":{"scope":"col"},"c":["k (games)"]},{"t":"th","a":{"scope":"col"},"c":["Games used"]},{"t":"th","a":{"scope":"col","class":"l"},"c":["Starts from"]},{"t":"th","a":{"scope":"col","class":"l"},"c":["Settings"]},{"t":"th","a":{"scope":"col","class":"l"},"c":["Results source"]}]}]},{"t":"tbody","a":{},"c":[{"t":"sc-for","a":{"list":"{{meth.rows}}","as":"r","hint-placeholder-count":"7"},"c":[{"t":"tr","a":{},"c":[{"t":"th","a":{"scope":"row","class":"l"},"c":["{{r.lg}}"]},{"t":"td","a":{},"c":["{{r.hfa}}"]},{"t":"td","a":{},"c":["{{r.sigma}}"]},{"t":"td","a":{},"c":["{{r.k}}"]},{"t":"td","a":{},"c":["{{r.games}}"]},{"t":"td","a":{"class":"l dim"},"c":["{{r.start}}"]},{"t":"td","a":{"class":"l dim"},"c":["{{r.fit}}"]},{"t":"td","a":{"class":"l dim"},"c":["{{r.src}}"]}]}]}]}]}]},{"t":"p","a":{"class":"s-note","style":"margin: 10px 0 0"},"c":["\u201cFit on past seasons\u201d means the settings were chosen by replaying past seasons and beat the preset ones on seasons held out of the fit; \u201cpreset\u201d means they are set by hand from the same replays (the NHL preset, for example, was raised to about 30 games of weight in October 2026 after the replays showed early-season NHL ratings were far too jumpy). MLB switched from season run margin to the same game-by-game method in October 2026, once twelve stored seasons showed it projects games better. Data files last updated {{meth.updated}}."]}]}]},{"t":"section","a":{"class":"t-panel","aria-label":"Sources"},"c":[{"t":"div","a":{"class":"t-ph"},"c":[{"t":"h2","a":{},"c":["Data sources"]}]},{"t":"div","a":{"class":"t-pb s-note"},"c":[{"t":"p","a":{"style":"margin: 0"},"c":["Scores, schedules, box scores, standings, team lists, injury reports and stat leaders come from ESPN\u2019s public site API. NFL seasons 1999\u20132013 and NFL closing lines come from nflverse (CC-BY 4.0). MLB probable starters and pitching lines come from the MLB Stats API (\u00a9 MLB Advanced Media, used for non-commercial purposes). NHL expected goals are from ",{"t":"a","a":{"href":"https://moneypuck.com"},"c":["MoneyPuck.com"]},". Live pages read it through this site\u2019s own cache (about 30 seconds for scores); standings, injuries and ratings are rebuilt hourly by a scheduled job, and team lists and leaders daily. College football results switch to CollegeFootballData automatically when an API key is configured."]},{"t":"p","a":{"style":"margin-bottom: 0"},"c":["Not shown or used in projections: betting lines (NFL closing lines only set the home edge and check the model), ESPN\u2019s own win probabilities and predictions, and ESPN\u2019s written recaps or injury notes."]}]}]}]}]},{"t":"footer","a":{"class":"t-foot"},"c":[{"t":"div","a":{"style":"max-width: 1280px; margin: 0 auto; padding: 16px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 12px","class":"dim"},"c":[{"t":"span","a":{},"c":["Data: ESPN public API \u00b7 Ratings, projections and odds: house model \u00b7 All times {{tzLabel}}"]},{"t":"span","a":{},"c":["Built by Nathan Skown"]}]}]},{"t":"div","a":{"class":"t-crt","aria-hidden":"true"},"c":[]}]}];</script>

<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { models: {}, injuries: {}, iq: '' }; }
  componentDidMount() {
    var self = this, key = this.props.tool;
    var ok = key === 'TrackRecord' ? ['all', 'nfl', 'ncaaf', 'nhl', 'nba', 'ncaab', 'ncaah'] : key === 'Odds' ? ['nfl', 'nhl'] : key === 'Injuries' ? ['nfl', 'mlb', 'nhl', 'nba'] : ['nfl', 'mlb', 'nhl', 'nba', 'ncaaf', 'ncaab', 'ncaah'];
    var lg = String(this.state.lg || (key === 'TrackRecord' ? 'all' : 'nfl')).toLowerCase();
    if (ok.indexOf(lg) < 0) lg = key === 'TrackRecord' ? 'all' : 'nfl';
    this.setState({ lg: lg });
    SD.data('teams.json').then(function (x) { self.setState({ index: x }); }, function () {});
    SD.data('status.json').then(function (x) { self.setState({ status: x }); }, function () {});
    if (key === 'TrackRecord') {
      SD.data('track/summary.json').then(function (x) { self.setState({ track: x }); }, function () { self.setState({ track: { err: true } }); });
      SD.data('track/backtest.json').then(function (x) { self.setState({ back: x }); }, function () { self.setState({ back: { err: true } }); });
    } else if (key === 'Methodology') ['nfl', 'mlb', 'nhl', 'nba', 'ncaaf', 'ncaab', 'ncaah'].forEach(function (k) { self.loadModel(k); });
    else this.loadLeague(lg);
  }
  loadStandings(lg) {
    var self = this, o = this.state.stand || {};
    if (o[lg]) return;
    SD.data('standings/' + lg + '.json').then(function (d) { var n = Object.assign({}, self.state.stand); n[lg] = d; self.setState({ stand: n }); }, function () { var n = Object.assign({}, self.state.stand); n[lg] = { err: true }; self.setState({ stand: n }); });
  }
  loadModel(lg) {
    var self = this;
    if (this.state.models[lg]) return;
    SD.data('model/' + lg + '.json').then(function (m) { var o = Object.assign({}, self.state.models); o[lg] = m; self.setState({ models: o }); }, function () { var o = Object.assign({}, self.state.models); o[lg] = { err: true }; self.setState({ models: o }); });
  }
  loadLeague(lg) {
    var self = this, key = this.props.tool;
    if (key === 'TrackRecord') return;
    if (key === 'Injuries') {
      if (!this.state.injuries[lg]) SD.data('injuries/' + lg + '.json').then(function (m) { var o = Object.assign({}, self.state.injuries); o[lg] = m; self.setState({ injuries: o }); }, function () {});
    } else { this.loadModel(lg); if (key === 'LuckWatch') this.loadStandings(lg); }
  }
  renderVals() {
    var TOOLS = {
      Simulator: ['SIM', 'Matchup simulator', 'Pick any two teams in a league to see the house model’s projected margin and win probability.'],
      Odds: ['ODDS', 'Playoff odds', 'Every team’s chances to make the playoffs, win its division and win it all, from 10,000 simulations of the rest of the season. Rebuilt every hour.'],
      Injuries: ['INJ', 'Injuries', 'League-wide injury reports for the four pro leagues, refreshed hourly.'],
      LuckWatch: ['LUCK', 'Luck watch', 'Teams whose record has outrun, or lagged, what their scoring margin says they should have won.'],
      Schedule: ['SOS', 'Schedule strength', 'How good the opponents each team has faced were, and, where the full schedule is published, how good the ones still to come are.'],
      TrackRecord: ['TRAK', 'Track record', 'Every house-model pick, saved before the game starts and graded after the final. The record begins empty at launch and fills one game at a time; nothing is back-filled.'],
      Methodology: ['METH', 'Methodology', 'How every rating, projection and probability in the Sports section is built, and where the data comes from.']
    };
    var S = this.state, self = this, key = TOOLS[this.props.tool] ? this.props.tool : 'Simulator', lg = S.lg || 'nfl';
    var fk = {}; Object.keys(TOOLS).forEach(function (k) { fk[k] = 't-fkey' + (k === key ? ' is-on' : ''); });
    var idx = {}; (((S.index || {}).leagues || {})[lg] || []).forEach(function (t) { idx[t.id] = t; });
    var live = { Simulator: 1, Odds: 1, Injuries: 1, TrackRecord: 1, Methodology: 1, LuckWatch: 1, Schedule: 1 };
    var tabsFor = key === 'TrackRecord' ? ['all', 'nfl', 'ncaaf', 'nhl', 'nba', 'ncaab', 'ncaah'] : key === 'Odds' ? ['nfl', 'nhl'] : key === 'Injuries' ? ['nfl', 'mlb', 'nhl', 'nba'] : ['nfl', 'mlb', 'nhl', 'nba', 'ncaaf', 'ncaab', 'ncaah'];
    var lgTabs = tabsFor.map(function (k) { return { label: k === 'all' ? 'All' : SD.LEAGUES[k].short, on: k === lg ? 'true' : 'false', cls: 's-tab' + (k === lg ? ' is-on' : ''),
      pick: function () { history.replaceState(null, '', '?lg=' + k); self.setState({ lg: k, simA: null, simH: null }); self.loadLeague(k); } }; });
    var out = { code: TOOLS[key][0], title: TOOLS[key][1], blurb: TOOLS[key][2], fk: fk, tag: 'DATA',
      showLg: !!live[key] && key !== 'Methodology', lgTabs: lgTabs, isSim: key === 'Simulator', isOdds: key === 'Odds', isInj: key === 'Injuries', isMeth: key === 'Methodology', isTrack: key === 'TrackRecord', isLuck: key === 'LuckWatch', isSos: key === 'Schedule' };
    var m = S.models[lg];
    // odds cells: the number plus a cyan heat shade that deepens with the probability; near-locks turn gold
    var heat = function (p) {
      if (p === undefined || p === null) return { v: '—', st: '' };
      var a = Math.max(0, Math.min(1, p));
      return { v: pct(p), st: p >= 0.995 ? 'color: #000; background: #ffc53d; font-weight: 600; text-shadow: none' :
        'background: rgba(61,242,255,' + (0.04 + a * 0.42).toFixed(3) + '); color: ' + (a >= 0.5 ? '#ffffff' : a >= 0.1 ? '#dcfcff' : '#80d4de') + (a >= 0.5 ? '; font-weight: 600' : '') };
    };
    var rate = function (v, dp) { return { v: (v > 0 ? '+' : '') + (v || 0).toFixed(dp), st: v > 0 ? 'color: var(--up)' : v < 0 ? 'color: var(--dn)' : '' }; };
    var plain = function (v) { return { v: v, st: 'color: var(--wh)' }; };
    var pct = function (p) { return p === undefined || p === null ? '—' : p >= 0.995 ? '>99%' : p < 0.005 ? '<1%' : Math.round(p * 100) + '%'; };

    if (key === 'Simulator') {
      var teams = m && m.teams ? Object.keys(m.teams) : [];
      var opts = teams.map(function (id) { return { id: id, name: (idx[id] || {}).name || id }; }).sort(function (a, b) { return a.name < b.name ? -1 : 1; });
      var a = S.simA || (opts[0] || {}).id, h = S.simH || (opts[1] || {}).id;
