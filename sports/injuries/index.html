t-size: 14px"},"c":[{"t":"p","a":{"style":"margin: 0"},"c":["Each team gets one number: how many points (goals, runs) better or worse than an average team it would be on a neutral field. It is solved from every completed game this season at once, so beating good teams counts more than beating bad ones, and the home team\u2019s built-in edge is taken out first."]},{"t":"p","a":{},"c":["Early in a season a few games say little, so every rating is pulled toward a starting point as if the team had already played ",{"t":"i","a":{},"c":["k"]}," games at that level. The starting point is the league average, or a share of the team\u2019s rating from last season where replaying past seasons showed that last year carries information (the table below says which leagues do). That is the same idea as \u201cSRS \u00d7 games \u00f7 (games + k)\u201d. College football margins are capped so a 60-point win over a weak opponent counts like a 35-point win, and teams outside the division the site covers (FCS, non-D-I) share one pooled rating."]},{"t":"p","a":{},"c":["The settings that are not obvious (home edge, how many games of weight the starting point gets, how much of last season to keep, the margin cap in college) are not guessed. The pipeline replays several past seasons week by week, projecting each week using only earlier games, and keeps the settings with the lowest log loss. It fits them on all but the newest stored season and checks them on that newest season; they replace the preset values only if they win there. The spread \u03c3 is the typical size of a projection error in that replay."]},{"t":"p","a":{},"c":["A game projection is the rating gap plus the home edge. The win probability treats the final margin as normally distributed around that projection with the league\u2019s spread (\u03c3 below): P(home wins) = \u03a6((home \u2212 away + home edge) \u00f7 \u03c3)."]},{"t":"p","a":{},"c":["Season odds replay the rest of the season 10,000 times. Each simulation draws every team\u2019s true strength from its rating and uncertainty, plays the remaining games, seeds the playoff bracket and plays it out. NFL tiebreakers are simplified to division record, then point margin. The NHL simulation plays each team\u2019s remaining games against a league-average opponent instead of the real schedule."]},{"t":"p","a":{},"c":["The Track record page logs the model\u2019s pick for every NFL, college football, NHL, NBA and college basketball and hockey game before it starts, freezes it at kickoff and grades it after the final. It begins empty at launch and is not back-filled. The backtest beside it replays past games using only earlier results; it is labelled separately because we ran it after the fact. MLB is not logged."]},{"t":"p","a":{"style":"margin-bottom: 0"},"c":["What it leaves out: injuries, rest, weather, lineup news and anything a betting market knows. Treat it as a well-calibrated baseline, not a forecast to bet on."]}]}]},{"t":"section","a":{"class":"t-panel","aria-label":"League settings"},"c":[{"t":"div","a":{"class":"t-ph"},"c":[{"t":"h2","a":{},"c":["League settings and live status"]},{"t":"span","a":{"class":"dim"},"c":["Read from the current model files"]}]},{"t":"div","a":{"class":"t-pb"},"c":[{"t":"div","a":{"class":"s-scroll"},"c":[{"t":"table","a":{"class":"s-tbl"},"c":[{"t":"thead","a":{},"c":[{"t":"tr","a":{},"c":[{"t":"th","a":{"scope":"col"},"c":["League"]},{"t":"th","a":{"scope":"col"},"c":["Home edge"]},{"t":"th","a":{"scope":"col"},"c":["\u03c3"]},{"t":"th","a":{"scope":"col"},"c":["k (games)"]},{"t":"th","a":{"scope":"col"},"c":["Games used"]},{"t":"th","a":{"scope":"col","class":"l"},"c":["Starts from"]},{"t":"th","a":{"scope":"col","class":"l"},"c":["Settings"]},{"t":"th","a":{"scope":"col","class":"l"},"c":["Results source"]}]}]},{"t":"tbody","a":{},"c":[{"t":"sc-for","a":{"list":"{{meth.rows}}","as":"r","hint-placeholder-count":"7"},"c":[{"t":"tr","a":{},"c":[{"t":"th","a":{"scope":"row","class":"l"},"c":["{{r.lg}}"]},{"t":"td","a":{},"c":["{{r.hfa}}"]},{"t":"td","a":{},"c":["{{r.sigma}}"]},{"t":"td","a":{},"c":["{{r.k}}"]},{"t":"td","a":{},"c":["{{r.games}}"]},{"t":"td","a":{"class":"l dim"},"c":["{{r.start}}"]},{"t":"td","a":{"class":"l dim"},"c":["{{r.fit}}"]},{"t":"td","a":{"class":"l dim"},"c":["{{r.src}}"]}]}]}]}]}]},{"t":"p","a":{"class":"s-note","style":"margin: 10px 0 0"},"c":["NFL division games use a smaller home edge than other games. \u201cFit on past seasons\u201d means the settings were chosen by replaying the last several seasons and beat the preset ones on a season held out of the fit; \u201cpreset\u201d means they are hand-set. MLB ratings are full-season run margin per game, regressed with 20 games of average weight. Data files last updated {{meth.updated}}."]}]}]},{"t":"section","a":{"class":"t-panel","aria-label":"Sources"},"c":[{"t":"div","a":{"class":"t-ph"},"c":[{"t":"h2","a":{},"c":["Data sources"]}]},{"t":"div","a":{"class":"t-pb s-note"},"c":[{"t":"p","a":{"style":"margin: 0"},"c":["Scores, schedules, box scores, standings, team lists, injury reports and stat leaders come from ESPN\u2019s public site API. Live pages read it through this site\u2019s own cache (about 30 seconds for scores); standings, injuries and ratings are rebuilt hourly by a scheduled job, and team lists and leaders daily. College football results switch to CollegeFootballData automatically when an API key is configured."]},{"t":"p","a":{"style":"margin-bottom: 0"},"c":["Not used: betting lines, ESPN\u2019s own win probabilities and predictions, and ESPN\u2019s written recaps or injury notes."]}]}]}]}]},{"t":"footer","a":{"class":"t-foot"},"c":[{"t":"div","a":{"style":"max-width: 1280px; margin: 0 auto; padding: 16px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 12px","class":"dim"},"c":[{"t":"span","a":{},"c":["Data: ESPN public API \u00b7 Ratings, projections and odds: house model \u00b7 All times Central"]},{"t":"span","a":{},"c":["Built by Nathan Skown"]}]}]},{"t":"div","a":{"class":"t-crt","aria-hidden":"true"},"c":[]}]}];</script>

<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { models: {}, injuries: {}, iq: '' }; }
  componentDidMount() {

    } else this.loadModel(lg);
  }
  renderVals() {
    var TOOLS = {
      Simulator: ['SIM', 'Matchup simulator', 'Pick any two teams in a league to see the house model’s projected margin and win probability.'],
      Odds: ['ODDS', 'Playoff odds', 'Every team’s chances to make the playoffs, win its division and win it all, from 10,000 simulations of the rest of the season. Rebuilt every hour.'],
      Spots: ['SPOT', 'Situational spots', 'Rest, travel, short weeks and look-ahead games: the schedule spots that historically move results.'],
      Injuries: ['INJ', 'Injuries', 'League-wide injury reports for the four pro leagues, refreshed hourly.'],
      LuckWatch: ['LUCK', 'Luck watch', 'Teams whose record has outrun, or lagged, their underlying numbers.'],
      Schedule: ['SOS', 'Schedule strength', 'Strength of schedule played and remaining for every team.'],
      TrackRecord: ['TRAK', 'Track record', 'Every house-model pick, saved before the game starts and graded after the final. The record begins empty at launch and fills one game at a time; nothing is back-filled.'],

    };
    var S = this.state, self = this, key = TOOLS[this.props.tool] ? this.props.tool : 'Simulator', lg = S.lg || 'nfl';
    var fk = {}; Object.keys(TOOLS).forEach(function (k) { fk[k] = 't-fkey' + (k === key ? ' is-on' : ''); });
    var idx = {}; (((S.index || {}).leagues || {})[lg] || []).forEach(function (t) { idx[t.id] = t; });
    var live = { Simulator: 1, Odds: 1, Injuries: 1, TrackRecord: 1, Methodology: 1 };
    var tabsFor = key === 'TrackRecord' ? ['all', 'nfl', 'ncaaf', 'nhl', 'nba', 'ncaab', 'ncaah'] : key === 'Odds' ? ['nfl', 'nhl'] : key === 'Injuries' ? ['nfl', 'mlb', 'nhl', 'nba'] : ['nfl', 'mlb', 'nhl', 'nba', 'ncaaf', 'ncaab', 'ncaah'];
    var lgTabs = tabsFor.map(function (k) { return { label: k === 'all' ? 'All' : SD.LEAGUES[k].short, on: k === lg ? 'true' : 'false', cls: 's-tab' + (k === lg ? ' is-on' : ''),
      pick: function () { history.replaceState(null, '', '?lg=' + k); self.setState({ lg: k, simA: null, simH: null }); self.loadLeague(k); } }; });
    var out = { code: TOOLS[key][0], title: TOOLS[key][1], blurb: TOOLS[key][2], fk: fk, soon: !live[key], tag: live[key] ? 'LIVE DATA' : 'COMING SOON',
      showLg: !!live[key] && key !== 'Methodology', lgTabs: lgTabs, isSim: key === 'Simulator', isOdds: key === 'Odds', isInj: key === 'Injuries', isMeth: key === 'Methodology', isTrack: key === 'TrackRecord' };
    var m = S.models[lg];
    var pct = function (p) { return p === undefined || p === null ? '—' : p >= 0.995 ? '>99%' : p < 0.005 ? '<1%' : Math.round(p * 100) + '%'; };

    if (key === 'Simulator') {
      var teams = m && m.teams ? Object.keys(m.teams) : [];
      var opts = teams.map(function (id) { return { id: id, name: (idx[id] || {}).name || id }; }).sort(function (a, b) { return a.name < b.name ? -1 : 1; });
      var a = S.simA || (opts[0] || {}).id, h = S.simH || (opts[1] || {}).id;
      var sim = { optsA: opts.map(function (x) { return { id: x.id, name: x.name, sel: x.id === a }; }), optsH: opts.map(function (x) { return { id: x.id, name: x.name, sel: x.id === h }; }), neutral: !!S.simN, note: m && m.season ? 'Season ' + m.season : '',
        onAway: function (e) { self.setState({ simA: e.target.value }); }, onHome: function (e) { self.setState({ simH: e.target.value }); }, onNeutral: function (e) { self.setState({ simN: e.target.checked }); }, has: false, foot: '' };
      if (!m) sim.foot = 'Loading the model…';
      else if (m.err) sim.foot = 'The model file did not load.';
      else if (a && h && a !== h) {
        var p = SD.project(m, a, h, !!S.simN), A = m.teams[a], H = m.teams[h];

          sim.aP = pct(p.pAway); sim.hP = pct(p.pHome);

          var lo = p.margin - z, hi = p.margin + z, f = function (v) { return (v > 0 ? (idx[h] || {}).abbr + ' +' : (idx[a] || {}).abbr + ' +') + Math.abs(v).toFixed(0); };
          sim.range = f(lo) + ' to ' + f(hi);
          sim.foot = 'Ratings: ' + sim.aName + ' ' + A.rating.toFixed(1) + ', ' + sim.hName + ' ' + H.rating.toFixed(1) + ' (' + m.unit + ' vs. average). σ = ' + m.sigma + '. ' + m.basis;
        } else sim.foot = 'One of these teams has not played enough games for a fair rating yet (needs ' + m.minGp + ').';
      } else sim.foot = 'Pick two different teams.';
      out.sim = sim;
    }
    if (key === 'Odds') {
      var o = { title: SD.LEAGUES[lg].label + ' playoff odds', sub: m && m.season ? 'Season ' + m.season : '', cols: [], rows: [], none: false, noneText: '', note: '' };
      if (!m) { o.none = true; o.noneText = 'Loading…'; }
      else if (!m.odds) { o.none = true; o.noneText = 'Simulations are not available right now: ' + (m.oddsBasis || 'not run') + '.'; }
      else {
        var ids = Object.keys(m.odds);
        if (lg === 'nfl') {
          o.cols = ['Rating', 'Proj. W', 'Playoffs', 'Division', 'No. 1 seed', 'Conf.', 'Title'];
          ids.sort(function (x, y) { return m.odds[y].title - m.odds[x].title || m.odds[y].playoff - m.odds[x].playoff; });
          o.rows = ids.map(function (id) { var r = m.odds[id], t = m.teams[id] || {}; return { name: (idx[id] || {}).name || id, logo: (idx[id] || {}).logo || '', href: SD.teamHref(lg, id), grp: t.group || '', cells: [(t.rating > 0 ? '+' : '') + (t.rating || 0).toFixed(1), r.wins.toFixed(1), pct(r.playoff), pct(r.div), pct(r.seed1), pct(r.conf), pct(r.title)] }; });
        } else {
          o.cols = ['Rating', 'Proj. PTS', 'Playoffs', 'Division', 'Conf.', 'Cup'];
          ids.sort(function (x, y) { return m.odds[y].title - m.odds[x].title || m.odds[y].playoff - m.odds[x].playoff; });
          o.rows = ids.map(function (id) { var r = m.odds[id], t = m.teams[id] || {}; return { name: (idx[id] || {}).name || id, logo: (idx[id] || {}).logo || '', href: SD.teamHref(lg, id), grp: t.group || '', cells: [(t.rating > 0 ? '+' : '') + (t.rating || 0).toFixed(2), r.pts.toFixed(0), pct(r.playoff), pct(r.div), pct(r.conf), pct(r.title)] }; });
        }
        o.note = m.oddsBasis + ' Ratings: ' + m.basis;
      }
      out.odds = o;
    }
    if (key === 'Injuries') {
      var d = S.injuries[lg], q = (S.iq || '').trim().toLowerCase();
      var stCol = function (s) { return /out|reserve|suspen/i.test(s || '') ? 'color: var(--dn)' : /doubt|question|day/i.test(s || '') ? 'color: #ffd166' : ''; };
      var tl = [];
      if (d && d.teams) Object.keys(d.teams).forEach(function (id) {
        var t = idx[id] || {}, name = t.name || id;
        var list = d.teams[id].filter(function (i) { return !/^active$/i.test(i.status || ''); }).filter(function (i) { return !q || name.toLowerCase().indexOf(q) >= 0 || [i.name, i.status, i.part, i.pos].join(' ').toLowerCase().indexOf(q) >= 0; });
        if (list.length) tl.push({ name: name, logo: t.logo || '', href: SD.teamHref(lg, id), list: list.map(function (i) { return { name: i.name, pos: i.pos || '', part: [i.side, i.part].filter(Boolean).join(' ') || '—', status: i.status || '', style: stCol(i.status) }; }) });
      });
      tl.sort(function (x, y) { return x.name < y.name ? -1 : 1; });
      var n = tl.reduce(function (s, t) { return s + t.list.length; }, 0);
      out.inj = { title: SD.LEAGUES[lg].label + ' injury report', sub: d ? n + ' players' : '', teams: tl, q: S.iq, onQ: function (e) { self.setState({ iq: e.target.value }); },
        none: !tl.length, noneText: !d ? 'Loading…' : (q ? 'Nothing matches “' + S.iq + '”.' : 'No injuries listed.') };
    }
    if (key === 'TrackRecord') {
      var T = S.track, B = S.back, f3 = function (v) { return v === null || v === undefined ? '—' : (+v).toFixed(3).replace(/^0/, ''); };
      var pc = function (v) { return v === null || v === undefined ? '—' : Math.round(v * 100) + '%'; };
      var L = ((S.index || {}).leagues) || {};
      var nm = function (k, id) { var t = ((L[k] || []).filter(function (x) { return x.id === id; })[0]) || {}; return { name: t.short || t.name || id, abbr: t.abbr || id }; };
      var tr = { title: lg === 'all' ? 'Live record, all leagues' : SD.LEAGUES[lg].label + ' live record', sub: '', none: false, noneText: '', has: false, cards: [], cal: [], note: '', recent: [], pend: [], noRecent: false, noPend: false, recentSub: '', pendSub: '', bt: [], btNone: false, btNoneText: '', btSub: '' };
      var pickRow = function (k, r, graded) {
        var h = nm(k, r.h), a = nm(k, r.a), fav = r.p >= 0.5 ? h : a, fp = Math.max(r.p, 1 - r.p);
        var row = { game: a.name + ' at ' + h.name + (r.n ? ' (neutral)' : ''), lg: SD.LEAGUES[k].short, href: SD.gameHref ? SD.gameHref(k, r.id) : '#', date: F.day(r.d + ':00Z'), pick: fav.abbr + ' ' + Math.abs(r.m).toFixed(1), prob: pc(fp) };
        if (graded) {
          var tie = r.hs === r.as, won = !tie && ((r.p >= 0.5) === (r.hs > r.as));
          row.final = a.abbr + ' ' + r.as + ', ' + h.abbr + ' ' + r.hs; row.res = tie ? 'Tie' : won ? 'Right' : 'Wrong'; row.style = tie ? '' : won ? 'color: var(--up)' : 'color: var(--dn)';
        } else row.date = r.d.replace('T', ' ');
        return row;
      };
      if (!T) { tr.none = true; tr.noneText = 'Loading…'; }
      else if (T.err) { tr.none = true; tr.noneText = 'The track-record file did not load. It is written by the hourly job after the first run.'; }
      else {
        var keys = lg === 'all' ? Object.keys(T.leagues) : [lg], st = lg === 'all' ? T.all : (T.leagues[lg] || {}).stats;
        var pen = [], pendN = 0, prog = 0;
        keys.forEach(function (k) { var e = T.leagues[k]; if (!e) return; pendN += e.pendingN; prog += e.inProgress;
          e.pending.forEach(function (r) { pen.push({ d: r.d, row: pickRow(k, r, false) }); }); });
        var recAll = []; keys.forEach(function (k) { (T.leagues[k] ? T.leagues[k].recent : []).forEach(function (r) { recAll.push({ d: r.d, row: pickRow(k, r, true) }); }); });
        recAll.sort(function (x, y) { return x.d < y.d ? 1 : -1; }); pen.sort(function (x, y) { return x.d < y.d ? -1 : 1; });
        tr.recent = recAll.slice(0, 40).map(function (x) { return x.row; }); tr.pend = pen.slice(0, 40).map(function (x) { return x.row; });
        tr.noRecent = !tr.recent.length; tr.noPend = !tr.pend.length;
        tr.sub = 'Updated ' + (T.updated ? F.day(T.updated) + ' ' + F.time(T.updated) + ' CT' : '—');
        tr.recentSub = tr.recent.length ? 'Newest first, up to 40' : ''; tr.pendSub = pendN + ' logged' + (prog ? ', ' + prog + ' in progress' : '');
        if (!st || !st.n) {
          tr.none = true;
          tr.noneText = 'Nothing graded yet. The log started when this page launched: ' + pendN + ' upcoming game' + (pendN === 1 ? ' is' : 's are') + ' saved so far, and each is graded after its final. There is no back-filled history here; the backtest below is the only past evidence.';
        } else {
          var small = st.n < 30;
          tr.has = true;
          tr.cards = [
            { k: 'Graded picks', v: st.n, s: st.decided + ' decided' + (st.n - st.decided ? ', ' + (st.n - st.decided) + ' tied' : '') },
            { k: 'Picked right', v: pc(st.acc), s: st.hits + ' of ' + st.decided },
            { k: 'Brier score', v: f3(st.brier), s: 'coin flip .250 · always-home ' + f3(st.homeBrier) },
            { k: 'Avg. miss', v: st.mae.toFixed(1), s: 'bias ' + (st.bias > 0 ? '+' : '') + st.bias.toFixed(1) + ' (home minus projection)' }
          ];
          tr.cal = (st.cal || []).map(function (c) { return { band: Math.round(c.lo * 100) + '–' + Math.min(100, Math.round(c.hi * 100)) + '%', n: c.n, exp: pc(c.exp), act: pc(c.act) }; });
          tr.note = (small ? 'Only ' + st.n + ' graded picks so far, so every number here can move a lot from one game. Do not read anything into it yet. ' : '') + 'Each calibration row should land close to the pick’s stated chance; rows with a handful of games are noise.';
        }
        tr.note += (tr.note ? ' ' : '') + 'MLB is not logged.';
      }
      if (!B) { tr.btNone = true; tr.btNoneText = 'Loading…'; }
      else if (B.err || !B.leagues) { tr.btNone = true; tr.btNoneText = 'The backtest file is not available yet. It is rebuilt once a day.'; }
      else {
        var ks = lg === 'all' ? Object.keys(B.leagues) : [lg];
        tr.bt = ks.filter(function (k) { return B.leagues[k] && B.leagues[k].n >= 20; }).map(function (k) { var b = B.leagues[k];
          return { lg: SD.LEAGUES[k].label, n: b.n, acc: pc(b.acc), brier: f3(b.brier), home: f3(b.homeBrier), mae: b.mae.toFixed(1), bias: (b.bias > 0 ? '+' : '') + b.bias.toFixed(1), span: b.from + ' to ' + b.to }; });
        var hidden = ks.filter(function (k) { return B.leagues[k] && B.leagues[k].n < 20; }).map(function (k) { return SD.LEAGUES[k].short; });
        tr.btSub = B.updated ? 'Rebuilt ' + F.day(B.updated) : '';
        if (!tr.bt.length) { tr.btNone = true; tr.btNoneText = 'Not enough completed games to backtest yet.'; }
        if (hidden.length) tr.btSub += (tr.btSub ? ' · ' : '') + 'too few games: ' + hidden.join(', ');
      }
      out.trk = tr;
    }
    if (key === 'Methodology') {
      out.meth = { updated: S.status && S.status.updated ? F.day(S.status.updated) + ' ' + F.time(S.status.updated) + ' CT' : '—',
        rows: ['nfl', 'mlb', 'nhl', 'nba', 'ncaaf', 'ncaab', 'ncaah'].map(function (k) { var x = S.models[k] || {};
          return { lg: SD.LEAGUES[k].label, hfa: x.hfa !== undefined ? x.hfa + ' ' + (x.unit || '') : '…', sigma: x.sigma !== undefined ? x.sigma : '…', k: x.k !== undefined ? x.k : '…', games: x.games !== undefined ? x.games : (k === 'mlb' ? 'season totals' : '…'), src: x.source || (x.err ? 'not loaded' : '…'), start: k === 'mlb' ? 'average' : (x.prior || 'average'), fit: k === 'mlb' ? 'preset' : (x.tuned ? 'fit on past seasons' : 'preset') }; }) };
    }
    return out;
